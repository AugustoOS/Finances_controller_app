  var total = totalCofre();
  var sug = sugestaoCofre(b);
  var falta = Math.max(0, sug - b.guardado);
  var obj = S.cofre.objetivo || {nome:"", valor:0};
  var movs = movimentosCofre(m);
  var padroes = [5,10,15,20,25,30];

  var html = '<h2>Cofrinho</h2>'+
    '<p class="sub">Uma fatia do que sobra, separada antes de virar gasto. Você escolhe a porcentagem e o app calcula quanto isso dá neste mês.</p>'+
    '<p class="sobra-label">Guardado até agora</p>'+
    '<div class="cofre-saldo num">'+fmt(total)+'</div>';

  if(Number(obj.valor) > 0){
    var pctObj = Math.max(0, Math.min(100, total / Number(obj.valor) * 100));
    html += '<div class="limite" style="margin-top:16px">'+esc(obj.nome || "Objetivo")+
      ' · faltam <b class="num">'+fmt(Math.max(0, Number(obj.valor) - total))+'</b> de '+fmt(obj.valor)+
      '<div class="barra"><div style="width:'+pctObj+'%;background:var(--free)"></div></div></div>';
  }

  html += '<div class="dados">'+
      linha("Base do cálculo", (S.cofre.base === "renda" ? "renda do mês" : "sobra depois das contas") + ", " + fmt(baseCofre(b)), true)+
      linha("Sugerido este mês ("+pctCofre()+"%)", fmt(sug))+
      linha("Já guardado em "+nomeMes(m), fmt(b.guardado))+
      linha("Cabe guardar ainda", fmt(Math.min(falta, Math.max(0, b.sobra))))+
    '</div>'+
    '<label>Quanto separar</label>'+
    '<div class="pcts">'+padroes.map(function(p){
      return '<button class="pct" data-act="set-pct" data-pct="'+p+'" aria-pressed="'+(p === pctCofre())+'">'+p+'%</button>';
    }).join("")+
    '<button class="pct" data-act="pct-outro" aria-pressed="'+(padroes.indexOf(pctCofre()) < 0)+'">outro</button></div>'+
    '<div class="pcts">'+
      '<button class="pct" data-act="set-base" data-base="sobra" aria-pressed="'+(S.cofre.base !== "renda")+'">% da sobra</button>'+
      '<button class="pct" data-act="set-base" data-base="renda" aria-pressed="'+(S.cofre.base === "renda")+'">% da renda</button>'+
    '</div>';

  if(movs.length){
    html += '<label>Movimentos de '+nomeMes(m)+'</label>'+
      '<div class="lista" style="padding:2px 14px">'+movs.map(function(mv){
        var v = Number(mv.valor)||0;
        return '<button class="mov" data-act="abrir-mov" data-id="'+mv.id+'"><span>'+esc(mv.nota || (v < 0 ? "resgate" : "depósito"))+'<small>'+(mv.dia||"")+' · toque para editar</small></span>'+
          '<span class="num"><b'+(v < 0 ? ' class="tira"' : '')+'>'+fmt(v)+'</b> '+
          '</span></button>';
      }).join("")+'</div>';
  }

  html += blocoConselhos(m, b, "Sobre o cofrinho", null, ["cofre"], 3)+
    '<button class="acao" data-act="guardar">Guardar dinheiro</button>'+
    '<button class="acao leve" data-act="resgatar">Resgatar</button>'+
    '<button class="acao leve" data-act="objetivo">'+(Number(obj.valor) > 0 ? 'Mudar objetivo' : 'Definir um objetivo')+'</button>';
  view.innerHTML = html;
}

function viewHistorico(b){
  var meses = mesesDoHistorico(S.mes, 12);
  var linhas = meses.map(function(m){ return {m:m, b:balanco(m), tem:temRegistro(m)}; });
  var tRenda = 0, tSaiu = 0, tGuardado = 0, tSobra = 0, comDados = 0;
  linhas.forEach(function(l){
    if(!l.tem) return;
    comDados++;
    tRenda += l.b.renda;
    tSaiu += l.b.jaSaiu - l.b.guardado;
    tGuardado += l.b.guardado;
    tSobra += l.b.sobra;
  });
  var tam = tamanhoDados();

  var html = '<h2>Últimos 12 meses</h2>'+
    '<p class="sub">De '+nomeMes(meses[0])+' a '+nomeMes(meses[11])+'. Toque num mês para abri-lo.</p>';

  if(!comDados){
    html += '<div class="vazio">Nada registrado nesse período ainda. Conforme você for lançando, cada mês aparece aqui com o que entrou, o que saiu e o que sobrou.</div>'+
      '<button class="acao leve" data-act="ir-ajustes">Voltar aos ajustes</button>';
    view.innerHTML = html;
    return;
  }

  html += '<div class="saldo-topo">'+
      '<span>Sobrou em '+comDados+(comDados === 1 ? ' mês com registro' : ' meses com registro')+'</span>'+
      '<b class="num'+(tSobra < 0 ? ' neg' : '')+'">'+fmt(tSobra)+'</b>'+
      '<span>entraram '+fmt(tRenda)+', saíram '+fmt(tSaiu)+
        (tGuardado !== 0 ? ' e '+fmt(tGuardado)+' foram pro cofrinho' : '')+
        '. Média de '+fmt(tSobra / comDados)+' de sobra por mês.</span>'+
    '</div>';

  html += '<div class="lista">'+linhas.map(function(l){
    var m = l.m, bb = l.b;
    var nome = MESES[(+m.split("-")[1])-1];
    nome = nome.charAt(0).toUpperCase() + nome.slice(1) + " de " + m.split("-")[0];
    if(!l.tem)
      return '<button class="item" data-act="ir-mes" data-mes="'+m+'">'+
        '<div class="item-topo"><span class="item-nome"><em style="color:var(--muted)">'+nome+'</em></span>'+
        '<span class="item-val" style="color:var(--muted);font-weight:400">sem registro</span></div></button>';

    var saiu = bb.jaSaiu - bb.guardado;
    var pct = bb.renda > 0 ? Math.min(100, saiu / bb.renda * 100) : (saiu > 0 ? 100 : 0);
    var cor = bb.sobra < 0 ? "var(--over)" : (pct >= 85 ? "var(--warn)" : "var(--brand)");
    var partes = [];
    if(bb.fatura.total > 0) partes.push("cartão " + fmtCurto(bb.fatura.total));
    if(bb.livres > 0) partes.push("avulsos " + fmtCurto(bb.livres));
    if(bb.guardado !== 0) partes.push("cofre " + fmtCurto(bb.guardado));

    return '<button class="item" data-act="ir-mes" data-mes="'+m+'">'+
      '<div class="item-topo">'+
        '<span class="item-nome"><em>'+nome+'</em></span>'+
        '<span class="item-val num"'+(bb.sobra < 0 ? ' style="color:var(--over)"' : '')+'>'+
          (bb.sobra < 0 ? 'faltou ' : 'sobrou ')+fmtCurto(bb.sobra)+'</span>'+
      '</div>'+
      '<div class="barra"><div style="width:'+pct+'%;background:'+cor+'"></div></div>'+
      '<div class="item-pe"><span>entrou '+fmtCurto(bb.renda)+' · saiu '+fmtCurto(saiu)+'</span>'+
        '<span>'+partes.join(" · ")+'</span></div>'+
    '</button>';
  }).join("")+'</div>';

  html += '<p class="dica-campo">Tudo que está guardado hoje ocupa cerca de '+Math.max(1, Math.round(tam.kb))+' KB no navegador.</p>'+
    '<button class="acao leve" data-act="ir-ajustes">Ajustes e cópia de segurança</button>';
  view.innerHTML = html;
}

function viewCasa(b){
  var pend = S.compras.filter(function(c){ return !c.compradoEm; });
  var feitos = S.compras.filter(function(c){ return c.compradoEm; });
  pend.sort(function(a,c){ return (c.prio||2) - (a.prio||2) || a.preco - c.preco; });

  var totalPend = pend.reduce(function(t,c){ return t + (Number(c.preco)||0); },0);
  var sobra = b.sobra;
  var cabem = 0, acc = 0;
  pend.forEach(function(c){ if(acc + Number(c.preco) <= sobra){ acc += Number(c.preco); cabem++; } });

  var html = '<h2>Coisas pra casa</h2><p class="sub">A lista compara cada item com o que sobra neste mês.</p>';

  if(S.compras.length){
    html += '<div class="resumo-compras">'+
      'Sobrando <b class="num">'+fmt(Math.max(0,sobra))+'</b>. '+
      (pend.length === 0 ? 'Lista zerada, tudo comprado.'
        : (cabem === 0 ? 'Nenhum item da lista cabe agora.'
          : 'Dá pra levar <b>'+cabem+(cabem>1?' itens':' item')+'</b> hoje, começando pelos de prioridade alta.'))+
      (pend.length ? ' A lista inteira soma <b class="num">'+fmt(totalPend)+'</b>.' : '')+
      '</div>';
  }

  if(S.compras.length === 0){
    html += '<div class="vazio">Lista vazia. Anote o que falta na casa e o app diz o que já dá pra comprar.</div>';
  }else{
    html += '<div class="lista">'+pend.map(function(c){
      var cabe = Number(c.preco) <= sobra;
      return '<button class="item" data-act="abrir-item" data-id="'+c.id+'">'+
        '<div class="item-topo">'+
          '<span class="item-nome"><em>'+esc(c.nome)+'</em></span>'+
          '<span class="badge '+(cabe?'ok':'nao')+'">'+(cabe?'cabe':'faltam '+fmtCurto(Number(c.preco)-sobra))+'</span>'+
        '</div>'+
        '<div class="item-pe"><span class="prio">'+prioNome(c.prio)+'</span><span class="num">'+fmt(c.preco)+'</span></div>'+
      '</button>';
    }).join("")+
    feitos.map(function(c){
      return '<button class="item" data-act="abrir-item" data-id="'+c.id+'">'+
        '<div class="item-topo">'+
          '<span class="item-nome"><em style="color:var(--muted);text-decoration:line-through">'+esc(c.nome)+'</em></span>'+
          '<span class="badge feito">comprado</span>'+
        '</div>'+
        '<div class="item-pe"><span class="prio">'+c.compradoEm+'</span><span class="num">'+fmt(c.preco)+'</span></div>'+
      '</button>';
    }).join("")+'</div>';
  }
  html += '<button class="acao" data-act="novo-item">Adicionar à lista</button>';
  view.innerHTML = html;
}
function prioNome(p){ return p===3?"prioridade alta":(p===1?"pode esperar":"prioridade média"); }

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* ========== sheet ========== */
var sheet = document.getElementById("sheet");
var backdrop = document.getElementById("backdrop");
function abrirSheet(html, aoAbrir){
  sheet.innerHTML = '<div class="puxador"></div>' + html;
  backdrop.classList.add("on");
  sheet.classList.add("on");
  if(aoAbrir) aoAbrir();
}
function fecharSheet(){
  sheet.classList.remove("on");
  backdrop.classList.remove("on");
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
backdrop.addEventListener("click", fecharSheet);

var toastT;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ t.classList.remove("on"); }, 2200);
}

/* ---- sheets específicos ---- */
function nomeMes(m){
  var p = m.split("-");
  return MESES[(+p[1])-1] + " de " + p[0];
}

function nomeMesTitulo(m){
  var n = nomeMes(m);
  return n.charAt(0).toUpperCase() + n.slice(1);
}

function itemReceb(m, r, acao){
  var rec = rendaRecebida(m, r);
  return '<button class="item" data-act="'+acao+'" data-id="'+r.id+'">'+
    '<div class="item-topo">'+
      '<span class="item-nome"><em>'+esc(r.nome || "Recebimento")+'</em></span>'+
      '<span class="item-val num">'+fmt(r.valor)+'</span>'+
    '</div>'+
    '<div class="item-pe"><span>dia '+limitaDia(m, r.dia)+' · '+(rec ? 'já caiu' : 'a receber')+'</span>'+
      '<span>'+(r.fixa ? 'todo mês' : 'só neste mês')+'</span></div>'+
  '</button>';
}

function camposReceb(r, m, diaBruto){
  return '<label for="rn">De onde vem</label>'+
    '<input id="rn" type="text" value="'+(r ? esc(r.nome||"") : "")+'" placeholder="Ex.: Salário, freela, bônus">'+
    '<div class="linha2">'+
      '<div><label for="rv">Valor</label>'+

      '<div style="flex:0 0 118px"><label for="rd">Cai no dia</label>'+
        '<input id="rd" inputmode="numeric" value="'+(r

function selectSituacao(sit){
  return '<select id="rr">'+
    '<option value="auto"'+(sit === "auto" ? " selected" : "")+'>Automático pela data</option>'+
    '<option value="sim"'+(sit === "sim" ? " selected" : "")+'>Já caiu na conta</option>'+
    '<option value="nao"'+(sit === "nao" ? " selected" : "")+'>Ainda não caiu</option>'+
  '</select>';
}

function sheetFixo(id){
  var m = S.mes;
  var r = id ? S.rendaModelo.filter(function(x){ return x.id === id; })[0] : null;
  var marca = r ? S.recebidos[m + "|" + r.id] : undefined;
  var sit = marca === true ? "sim" : (marca === false ? "nao" : "auto");
  abrirSheet(
    '<h3>'+(r ? esc(r.nome || "Renda fixa") : 'Nova renda fixa')+'</h3>'+
    '<p class="sub">Entra todo mês, sempre no mesmo dia. Valor e dia mudam para todos os meses de uma vez.</p>'+
    camposReceb(r, m, true)+
    (r ? '<label for="rr">Situação em '+nomeMes(m)+'</label>'+selectSituacao(sit)+
         '<p class="dica-campo">Só a situação vale por mês. Sem mexer nela, a renda conta como recebida quando o dia chega.</p>' : '')+
    '<button class="acao" data-act="salvar-fixa" data-id="'+(id||"")+'">'+(r ? 'Salvar' : 'Adicionar')+'</button>'+
    (r ? '<button class="acao perigo" data-act="excluir-fixa" data-id="'+r.id+'">Excluir renda fixa</button>' : ''),
    function(){ setTimeout(function(){ var f = document.getElementById(r ? "rv" : "rn"); if(f) f.focus(); }, 120); }
  );
}

function sheetGanho(id){
  var m = S.mes;

  var sit = g && g.recebido === true ? "sim" : (g && g.recebido === false ? "nao" : "auto");
  abrirSheet(
    '<h3>'+(g ? esc(g.nome || "Ganho") : 'Ganho deste mês')+'</h3>'+
    '<p class="sub">Dinheiro que entrou só em '+nomeMes(m)+': freela, bônus, venda, presente, décimo terceiro. Não se repete nos outros meses.</p>'+

function textoParcelamento(total, n, mesInicio){
  if(total <= 0) return "Preencha o valor e as vezes para ver a parcela.";
  var v = Math.round(total / n * 100) / 100;
  if(n <= 1) return "à vista, " + fmt(total) + " · na fatura de " + nomeMes(mesInicio);
  return n + "x de " + fmt(v) + " · total " + fmt(total) +
    " · de " + nomeMes(mesInicio) + " a " + nomeMes(mesVizinho(mesInicio, n-1));
}

function sheetGasto(gid){
  var m = S.mes;
  var g = gastosDoMes(m).filter(function(x){ return x.id === gid; })[0];
  if(!g){ sheetAvulsos(); return; }
  var avulso = !g.pid;
  var part = g.pid ? S.particoes.filter(function(p){ return p.id === g.pid; })[0] : null;
  var origem = avulso ? origemDoAvulso(m, g) : ("em " + (part ? part.nome : "uma repartição"));
  var daCasa = avulso && origem === "veio da lista da casa";
  var diaAtual = Number(String(g.dia || "").split("/")[0]) || (diaDeHoje(m) || 1);
  var meio = meioDePagamento(g);
  abrirSheet(
    '<h3>'+esc(g.nota || (part ? part.nome : "Gasto"))+'</h3>'+
    '<p class="sub">Lançado em '+esc(g.dia || nomeMes(m))+', '+esc(origem)+
      (meio ? ', pago ' + esc(meio) : '')+'. Dá pra mudar o valor, o nome, o dia, como foi pago e onde ele conta.</p>'+
    '<div class="linha2">'+
      '<div><label for="av">Valor</label>'+
        '<input id="av" inputmode="decimal" value="'+(g.valor ? String(g.valor).replace(".",",") : "")+'" placeholder="0,00"></div>'+
      '<div style="flex:0 0 118px"><label for="ad">Dia</label>'+
        '<input id="ad" inputmode="numeric" value="'+limitaDia(m, diaAtual)+'" placeholder="1"></div>'+
    '</div>'+
    '<label for="an">No que foi</label>'+
    '<input id="an" type="text" value="'+esc(g.nota || "")+'" placeholder="Ex.: rodízio com a galera">'+
    (S.particoes.length
      ? '<label for="ap">Contar em qual repartição</label>'+
        '<select id="ap"><option value=""'+(avulso ? ' selected' : '')+'>Nenhuma, fica avulso</option>'+
        S.particoes.map(function(p){
          return '<option value="'+p.id+'"'+(p.id === g.pid ? ' selected' : '')+'>'+esc(p.nome)+'</option>';
        }).join("")+'</select>'
      : '')+
    camposPagamento(m, g.cartao, g.fatMes, diaAtual)+
    (g.parc ? '<p class="dica-campo">Este lançamento paga um vencimento da repartição. Se mudar de repartição, ele deixa de contar como esse pagamento.</p>' : '')+
    '<button class="acao" data-act="salvar-gasto-edit" data-gid="'+g.id+'" data-mes="'+m+'">Salvar</button>'+
    '<button class="acao perigo" data-act="apagar-gasto" data-gid="'+g.id+'" data-mes="'+m+'">Apagar lançamento</button>'+
    (daCasa
      ? '<p class="dica-campo">Este veio de um item marcado como comprado na Casa. Apagar aqui tira só o gasto e o item continua marcado; para desfazer os dois, use Desfazer compra na aba Casa.</p>'
      : ''),
    function(){ setTimeout(function(){ var f = document.getElementById("av"); if(f) f.focus(); }, 120); }
  );
}
function sheetAvulso(gid){ sheetGasto(gid); }

function textoPagamento(cid, m, dia){
  if(!cid) return "Sai da conta na hora.";
  var ct = cartaoPorId(cid);
  if(!ct) return "";
  var mf = faturaDoDia(ct, m || S.mes, dia || diaDeHoje(m || S.mes) || 1);
  var lim = limiteUtil(ct);
  return "Não sai agora: cai na fatura de " + nomeMes(mf) + ", que vence " + janelaDaFatura(ct, mf).vence + "." +
    (lim > 0 ? " Livre no " + ct.nome + ": " + fmt(limiteLivre(ct)) + "." : "");
}
function diaDoPagamento(m){
  var campo = document.getElementById("ad");
  var d = campo ? parseNum(campo.value) : 0;
  return d > 0 ? d : (diaDeHoje(m) || 1);
}
function opcoesFatura(m, cid, fatMes, dia){
  var ct = cartaoPorId(cid);
  var padrao = ct ? faturaDoDia(ct, m, dia) : m;
  var lista = [padrao, mesVizinho(padrao, 1)];
  var sel = fatMes || padrao;
  if(lista.indexOf(sel) < 0) lista.unshift(sel);
  return lista.map(function(mm){
    return '<option value="'+mm+'"'+(mm === sel ? ' selected' : '')+'>'+nomeMes(mm)+'</option>';
  }).join("");
}
function camposPagamento(m, cid, fatMes, dia){
  if(!S.cartoes.length) return "";
  var atual = cid || "";
  var d = dia || diaDeHoje(m) || 1;
  return '<label for="gpg">Como paga</label>'+
    '<select id="gpg" data-mes="'+m+'">'+
      '<option value=""'+(atual ? '' : ' selected')+'>Dinheiro, pix ou débito</option>'+
      S.cartoes.map(function(ct){
        return '<option value="'+ct.id+'"'+(ct.id === atual ? ' selected' : '')+'>Cartão '+esc(ct.nome)+'</option>';
      }).join("")+
    '</select>'+
    '<div id="gfat"'+(atual ? '' : ' style="display:none"')+'>'+
      '<label for="gfm">Entra na fatura de</label>'+
      '<select id="gfm">'+opcoesFatura(m, atual, fatMes, d)+'</select>'+
    '</div>'+
    '<p class="dica-campo" id="gdica">'+textoPagamento(atual, m, d)+'</p>';
}
function atualizarPagamento(){
  var sel = document.getElementById("gpg");
  if(!sel) return;
  var m = sel.dataset.mes || S.mes;
  var dia = diaDoPagamento(m);
  var bloco = document.getElementById("gfat");
  if(bloco) bloco.style.display = sel.value ? "" : "none";
  var selM = document.getElementById("gfm");
  if(selM && sel.value && selM.dataset.cartao !== sel.value){
    selM.innerHTML = opcoesFatura(m, sel.value, null, dia);
    selM.dataset.cartao = sel.value;
  }
  var dica = document.getElementById("gdica");
  if(dica) dica.textContent = textoPagamento(sel.value, m, dia);
}
function lerPagamento(m){
  var sel = document.getElementById("gpg");
  var cid = sel ? sel.value : "";
  if(!cid) return {cartao:null, fatMes:null};
  var selM = document.getElementById("gfm");
  return {cartao:cid, fatMes:(selM && selM.value) ? selM.value : m};
}

/* ========== ações ========== */
function addGasto(pid, valor, nota, parc, cartao, fatMes){
  if(!S.gastos[S.mes]) S.gastos[S.mes] = [];
  var g = {
    id:uid(), pid:pid||null, valor:valor, nota:nota||"",
    dia: new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})
  };
  if(parc) g.parc = parc;
  if(cartao){ g.cartao = cartao; g.fatMes = fatMes || S.mes; }
  S.gastos[S.mes].push(g);
  salvar();
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act],[data-tab]");
  if(!el) return;

  if(el.dataset.tab){ irParaAba(el.dataset.tab); return; }
  var a = el.dataset.act;

  if(a === "mes-ant" || a === "mes-prox"){
    var p = S.mes.split("-"), d = new Date(+p[0], (+p[1]-1) + (a==="mes-prox"?1:-1), 1);
    S.mes = chaveMes(d); render(); return;
  }

  if(a === "ir-ajustes"){ S.aba = "ajustes"; render(); return; }
  if(a === "ir-aba"){ fecharSheet(); irParaAba(el.dataset.aba || "mes"); return; }
  if(a === "ir-historico"){ S.aba = "historico"; render(); return; }
  if(a === "ir-mes"){ S.mes = el.dataset.mes; S.aba = el.dataset.aba || "mes"; render(); return; }
  if(a === "ver-texto"){ S.verTexto = !S.verTexto; render(); return; }
  if(a === "baixar"){
    try{
      var texto = JSON.stringify(dados());
      var blob = new Blob([texto], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "finances-controller-" + hojeISO() + ".json";
      document.body.appendChild(link);
      link.click();
      setTimeout(function(){
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1500);
      toast("Arquivo da cópia gerado");
    }catch(e){
      S.verTexto = true; render();
      toast("Este navegador não baixou o arquivo. Copie o texto.");
    }
    return;
  }
  if(a === "abrir-arquivo"){
    var campo = document.getElementById("arq");
    if(campo) campo.click();
    return;
  }
  if(a === "limpar-antigos"){
    if(el.dataset.ok){
      var r = limparAntigos();
      salvar(); render();
      toast(r.n ? r.n + " registros antigos apagados" : "Não havia nada anterior a " + nomeMes(r.corte));
      return;
    }
    el.dataset.ok = "1";
    el.textContent = "Isso apaga meses antigos. Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar o que tem mais de 12 meses"; } }, 3500);
    return;
  }
  if(a === "ir-cartao"){ irParaAba("cartao"); return; }
  if(a === "ir-emprestimo"){ irParaAba("emprestimo"); return; }
  if(a === "novo-emprestimo"){ sheetEmprestimo(null); return; }
  if(a === "abrir-emprestimo"){ sheetEmprestimo(el.dataset.id); return; }
  if(a === "salvar-emprestimo"){
    var emNome = document.getElementById("en").value.trim();
    if(!emNome){ toast("Falta o nome do empréstimo"); return; }
    var emVal = parseNum(document.getElementById("ev").value);
    if(emVal <= 0){ toast("Coloque o valor da parcela"); return; }
    var emQtd = Math.max(1, Math.min(480, Math.round(parseNum(document.getElementById("eq").value) || 1)));
    var emIni = document.getElementById("ei").value;
    var emDia = Math.max(1, Math.min(31, Math.round(parseNum(document.getElementById("ed").value) || 10)));
    var emCredor = document.getElementById("ec").value.trim();
    var corEm = sheet.querySelector('.cor[aria-pressed="true"]');
    var emCor = corEm ? corEm.dataset.cor : CORES[7];
    var emId = el.dataset.id;
    if(emId){
      S.emprestimos.forEach(function(x){
        if(x.id !== emId) return;
        x.nome=emNome; x.credor=emCredor; x.valorParcela=emVal;
        x.parcelas=emQtd; x.inicio=emIni; x.dia=emDia; x.cor=emCor;
      });
    }else{
      S.emprestimos.push({
        id:uid(), nome:emNome, credor:emCredor, valorParcela:emVal,
        parcelas:emQtd, inicio:emIni, dia:emDia, pagas:{}, cor:emCor
      });
    }
    salvar(); fecharSheet(); irParaAba("emprestimo");
    toast(emQtd + "x de " + fmt(emVal) + ", total " + fmt(Math.round(emQtd * emVal * 100) / 100));
    return;
  }
  if(a === "pagar-emprestimo" || a === "desmarcar-emprestimo"){
    var epId = el.dataset.id, marcando = a === "pagar-emprestimo";
    S.emprestimos.forEach(function(x){
      if(x.id !== epId) return;
      if(!x.pagas) x.pagas = {};
      if(marcando) x.pagas[S.mes] = true;
      else delete x.pagas[S.mes];
    });
    salvar(); fecharSheet(); render();
    toast(marcando ? "Parcela marcada como paga" : "Parcela reaberta");
    return;
  }
  if(a === "excluir-emprestimo"){
    var exId = el.dataset.id;
    S.emprestimos = S.emprestimos.filter(function(x){ return x.id !== exId; });
    salvar(); fecharSheet(); render(); toast("Empréstimo excluído"); return;
  }

  if(a === "novo-cartao"){ sheetCartao(null); return; }
  if(a === "abrir-cartao"){ sheetCartao(el.dataset.id); return; }
  if(a === "salvar-cartao"){
    var ctNome = document.getElementById("ctn").value.trim();
    if(!ctNome){ toast("Falta o nome do cartão"); return; }
    var ctLim = parseNum(document.getElementById("ctl").value);
    var ctConv = Math.max(0, parseNum(document.getElementById("ctc").value));
    var ctVenc = Math.max(1, Math.min(31, Math.round(parseNum(document.getElementById("ctv").value) || 10)));
    var ctFech = Math.max(1, Math.min(31, Math.round(parseNum(document.getElementById("ctf").value) || 5)));
    var ctDep = document.getElementById("ctd").value === "1";
    var corCt = sheet.querySelector('.cor[aria-pressed="true"]');
    var ctCor = corCt ? corCt.dataset.cor : CORES[0];
    var ctId = el.dataset.id;
    if(ctId){
      S.cartoes.forEach(function(x){
        if(x.id === ctId){ x.nome=ctNome; x.limite=ctLim; x.convertido=ctConv; x.vencimento=ctVenc; x.fechamento=ctFech; x.venceDepois=ctDep; x.cor=ctCor; }
      });
    }else{
      S.cartoes.push({id:uid(), nome:ctNome, limite:ctLim, convertido:ctConv, vencimento:ctVenc, fechamento:ctFech, venceDepois:ctDep, cor:ctCor});
    }
    salvar(); fecharSheet(); S.aba = "cartao"; render();
    var usadoCt = usadoDoCartao(ctId || S.cartoes[S.cartoes.length-1].id);
    toast(ctLim - ctConv > 0 && usadoCt > ctLim - ctConv + 0.005
      ? "Salvo, mas já há " + fmt(usadoCt) + " comprometidos"
      : "Cartão salvo");
    return;
  }
  if(a === "excluir-cartao"){
    var ctX = el.dataset.id;
    S.cartoes = S.cartoes.filter(function(x){ return x.id !== ctX; });
    S.comprasCartao = S.comprasCartao.filter(function(x){ return x.cartao !== ctX; });
    Object.keys(S.faturas).forEach(function(k){ if(k.indexOf(ctX + "|") === 0) delete S.faturas[k]; });
    salvar(); fecharSheet(); render(); toast("Cartão excluído"); return;
  }

  if(a === "antecipar"){ sheetAntecipar(el.dataset.id); return; }
  if(a === "salvar-antecipacao"){
    var acId = el.dataset.id, acMax = Number(el.dataset.max) || 0;
    var acC = S.comprasCartao.filter(function(x){ return x.id === acId; })[0];
    if(!acC) return;
    var acN = Math.round(parseNum(document.getElementById("acn").value) || 0);
    if(acN <= 0){ toast("Diga quantas parcelas quer antecipar"); return; }
    if(acN > acMax){ toast("Só dá para antecipar " + acMax + " parcela" + (acMax > 1 ? "s" : "")); return; }
    var acValor = valorDeAntecipar(acC, acN);
    acC.antecipadas = antecipadasDe(acC) + acN;
    addGasto(null, acValor, "Antecipação de " + acN + (acN > 1 ? " parcelas de " : " parcela de ") + acC.nome);
    var acLista = gastosDoMes(S.mes);
    acLista[acLista.length - 1].antecipa = acC.id;
    salvar(); fecharSheet(); render();
    toast("Antecipadas " + acN + " parcela" + (acN > 1 ? "s" : "") + ", " + fmt(acValor));
    return;
  }
  if(a === "desfazer-antecipacao"){
    var daId = el.dataset.id;
    S.comprasCartao.forEach(function(c){ if(c.id === daId) delete c.antecipadas; });
    Object.keys(S.gastos).forEach(function(mm){
      S.gastos[mm] = (S.gastos[mm] || []).filter(function(g){ return g.antecipa !== daId; });
    });
    salvar(); fecharSheet(); render(); toast("Antecipação desfeita"); return;
  }
  if(a === "nova-compra"){ sheetCompra(null); return; }
  if(a === "abrir-compra"){ sheetCompra(el.dataset.id); return; }
  if(a === "salvar-compra"){
    var cpNome = document.getElementById("cnm").value.trim();
    if(!cpNome){ toast("Falta o nome da compra"); return; }
    var cpTot = parseNum(document.getElementById("cvt").value);
    if(cpTot <= 0){ toast("Coloque um valor maior que zero"); return; }
    var cpN = Math.max(1, Math.min(99, Math.round(parseNum(document.getElementById("cnp").value) || 1)));
    var selCard = document.getElementById("ccc");
    var cpCid = selCard ? selCard.value : el.dataset.cartao;
    var campoData = document.getElementById("cdt");
    var cpData = campoData && campoData.value ? campoData.value : hojeISO();
    if(cpData > hojeISO()) cpData = hojeISO();
    var cpIni = faturaDaData(cartaoPorId(cpCid) || {}, cpData);
    var cpId = el.dataset.id;
    var ckC = cabeNoLimite(cpCid, comprometidoDaCompra({
      cartao:cpCid, total:cpTot, parcelas:cpN, inicio:cpIni, data:cpData
    }), cpId || null, null);
    if(!ckC.ok){ toast(recusaLimite(ckC, cpCid)); return; }
    if(cpId){
      S.comprasCartao.forEach(function(c){
        if(c.id === cpId){
          c.nome=cpNome; c.total=cpTot; c.parcelas=cpN;
          c.cartao=cpCid; c.data=cpData; c.inicio=cpIni;
        }
      });
    }else{
      S.comprasCartao.push({
        id:uid(), cartao:cpCid, nome:cpNome, total:cpTot,
        parcelas:cpN, data:cpData, inicio:cpIni
      });
    }
    salvar(); fecharSheet(); S.aba = "cartao"; render();
    toast(cpN > 1
      ? cpN + "x de " + fmt(Math.round(cpTot/cpN*100)/100) + " a partir de " + nomeMes(cpIni)
      : "Lançado " + fmt(cpTot));
    return;
  }
  if(a === "excluir-compra"){
    var cpX = el.dataset.id;
    S.comprasCartao = S.comprasCartao.filter(function(c){ return c.id !== cpX; });
    salvar(); fecharSheet(); render(); toast("Compra excluída"); return;
  }
  if(a === "pagar-fatura"){ sheetPagarFatura(el.dataset.id, el.dataset.mes || S.mes); return; }
  if(a === "quitar-fatura"){
    S.faturas[el.dataset.id + "|" + (el.dataset.mes || S.mes)] = true;
    salvar(); fecharSheet(); render(); toast("Fatura quitada"); return;
  }

    var fPg = faturaDoCartao(pgCid, pgMes);
    var soma = Math.round((fPg.pagoValor + pgVal) * 100) / 100;
    S.faturas[pgCid + "|" + pgMes] = soma >= fPg.total - 0.005 && fPg.total > 0 ? true : soma;
    salvar(); fecharSheet(); render();
    var depois = faturaDoCartao(pgCid, pgMes);

    if(!Array.isArray(S.ganhos[S.mes])) S.ganhos[S.mes] = [];
    var listaG = S.ganhos[S.mes], achouG = false;
    listaG.forEach(function(x){

    });

      var novoG = {id:gId, nome:gNome, valor:gValor, dia:gDia};

      if(sitG === "nao") novoG.recebido = false;
      listaG.push(novoG);
    }
    listaG.sort(function(x,y){ return (Number(x.dia)||1) - (Number(y.dia)||1); });

  if(a === "excluir-ganho"){
    var gX = el.dataset.id;
    S.ganhos[S.mes] = ganhosDoMes(S.mes).filter(function(x){ return x.id !== gX; });
    if(!S.ganhos[S.mes].length) delete S.ganhos[S.mes];

  }
  if(a === "virar-fixa"){

    var vG = ganhosDoMes(S.mes).filter(function(x){ return x.id === vX; })[0];

    S.rendaModelo.push({
      id:uid(), nome:vG.nome, valor:Number(vG.valor)||0,
      dia:Math.max(1, Math.min(31, Math.round(Number(vG.dia)||1)))
    });
    S.rendaModelo.sort(function(x,y){ return (Number(x.dia)||1) - (Number(y.dia)||1); });
    S.ganhos[S.mes] = ganhosDoMes(S.mes).filter(function(x){ return x.id !== vX; });
    if(!S.ganhos[S.mes].length) delete S.ganhos[S.mes];
    salvar(); fecharSheet(); render(); toast("Agora entra todo mês"); return;
  }

  if(a === "nova-part"){ sheetParticao(null); return; }
  if(a === "abrir-part"){ sheetParticao(el.dataset.id); return; }
  if(a === "nova-sug"){
    S.particoes.push({id:uid(), nome:el.dataset.nome, planejado:0, cor:CORES[S.particoes.length % CORES.length], parcelas:[]});

      campos[campos.length-1].focus();

  }
  if(a === "rm-parcela"){

    if(alvo) alvo.parentNode.removeChild(alvo);
    return;
  }
  if(a === "pagar-parcela"){
    var pAlvo = S.particoes.filter(function(x){ return x.id === el.dataset.id; })[0];
    if(!pAlvo) return;
    var pcAlvo = parcelasDe(pAlvo).filter(function(x){ return x.id === el.dataset.parc; })[0];
    if(!pcAlvo) return;
    var falta = (Number(pcAlvo.valor)||0) - pagoDaParcela(S.mes, pcAlvo.id);
    if(falta <= 0){ toast("Essa parcela já está paga"); return; }
    addGasto(pAlvo.id, falta, "vencimento dia " + limitaDia(S.mes, pcAlvo.dia), pcAlvo.id);

  if(a === "salvar-part"){

    var linhasP = sheet.querySelectorAll(".parcela");

      var valP = parseNum(linhasP[li].querySelector(".pval").value);
      if(valP <= 0) continue;
      novasParcelas.push({
        id: linhasP[li].dataset.parc || uid(),
        dia: limitaDia(S.mes, parseNum(linhasP[li].querySelector(".pdia").value) || 1),
        valor: valP
      });
    }
    novasParcelas.sort(function(x,y){ return x.dia - y.dia; });
    if(novasParcelas.length)
      plan = novasParcelas.reduce(function(t,x){ return t + x.valor; }, 0);
    var id = el.dataset.id;
    if(id){
      S.particoes.forEach(function(p){
        if(p.id===id){ p.nome=nome; p.planejado=plan; p.cor=cor; p.parcelas=novasParcelas; }
      });
    }else{
      S.particoes.push({id:uid(), nome:nome, planejado:plan, cor:cor, parcelas:novasParcelas});

  }
  if(a === "excluir-part"){
    var pid = el.dataset.id;
    S.particoes = S.particoes.filter(function(p){ return p.id !== pid; });

      S.gastos[m] = S.gastos[m].map(function(g){
        if(g.pid === pid){ g.pid = null; g.nota = g.nota || "de repartição excluída"; }

      });

    addGasto(el.dataset.id, val, "", null, pgP.cartao, pgP.fatMes);

    gastosDoMes(gsMes).forEach(function(g){
      if(g.id !== gsId) return;

      g.nota = gsNota;
      g.dia = String(gsDia).padStart(2,"0") + "/" + gsMes.split("-")[1];

    salvar(); fecharSheet(); render(); toast("Item salvo"); return;
  }
  if(a === "comprar"){
    var cid = el.dataset.id;
    S.compras.forEach(function(c){
      if(c.id===cid){ c.compradoEm = S.mes; addGasto(null, Number(c.preco)||0, c.nome); }
    });
    salvar(); fecharSheet(); render(); toast("Comprado e lançado no mês"); return;
  }
  if(a === "descomprar"){
    var did = el.dataset.id;
    S.compras.forEach(function(c){
      if(c.id===did){
        var m = c.compradoEm;
        if(m && S.gastos[m]){
          var idx = -1;
          for(var k=S.gastos[m].length-1;k>=0;k--){
            if(!S.gastos[m][k].pid && S.gastos[m][k].nota === c.nome){ idx = k; break; }

          if(idx > -1) S.gastos[m].splice(idx,1);

        c.compradoEm = null;
      }
    });
    salvar(); fecharSheet(); render(); toast("Voltou pra lista"); return;
  }
  if(a === "excluir-item"){
    var eid = el.dataset.id;
    S.compras = S.compras.filter(function(c){ return c.id !== eid; });
    salvar(); fecharSheet(); render(); toast("Item removido"); return;
  }

  if(a === "copiar"){
    var ta = document.getElementById("bk");
    ta.select(); ta.setSelectionRange(0, 999999);
    try{ document.execCommand("copy"); toast("Cópia na área de transferência"); }
    catch(e){ toast("Selecione o texto e copie na mão"); }
    return;
  }
  if(a === "restaurar"){
    try{
      aplicarDados(JSON.parse(document.getElementById("bk").value));
      salvar(); render(); toast("Dados restaurados");
    }catch(e){ toast("Esse texto não é uma cópia válida"); }
    return;
  }
  if(a === "limpar-mes"){
    if(el.dataset.ok){
      delete S.gastos[S.mes]; salvar(); render(); toast("Lançamentos do mês apagados"); return;
    }
    el.dataset.ok = "1"; el.textContent = "Tem certeza? Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar os lançamentos deste mês"; } }, 3500);
    return;
  }
  if(a === "zerar"){
    if(el.dataset.ok){
      localStorage.removeItem(KEY);
      localStorage.removeItem(KEY_ANTIGA);
      S.rendaModelo=[]; S.ganhos={}; S.recebidos={};
      S.particoes=[]; S.gastos={}; S.compras=[];
      S.cartoes=[]; S.comprasCartao=[]; S.faturas={}; S.emprestimos=[];
      S.cofre={pct:COFRE_PADRAO.pct, base:"sobra", objetivo:{nome:"", valor:0}, movimentos:[]};
      S.aba="mes"; render(); toast("Tudo zerado"); return;
    }
    el.dataset.ok = "1"; el.textContent = "Isso apaga tudo. Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar tudo e recomeçar"; } }, 3500);
    return;
  }
});

document.addEventListener("change", function(ev){
  var campo = ev.target;
  if(!campo || campo.id !== "arq" || !campo.files || !campo.files[0]) return;
  var leitor = new FileReader();
  leitor.onload = function(){
    try{
      aplicarDados(JSON.parse(String(leitor.result)));
      salvar(); render();
      toast("Dados restaurados do arquivo");
    }catch(e){ toast("Esse arquivo não é uma cópia válida"); }
  };
  leitor.onerror = function(){ toast("Não consegui ler esse arquivo"); };
  leitor.readAsText(campo.files[0]);
  campo.value = "";
});

document.addEventListener("change", function(ev){
  if(!ev.target) return;
  if(ev.target.id === "cdt" || ev.target.id === "ccc") atualizarDicaParcela();
  if(ev.target.id === "gpg") atualizarPagamento();
  if(ev.target.id === "ctd") atualizarDicaCartao();
});

function atualizarDicaParcela(){
  var dica = document.getElementById("dicaParcela");
  if(!dica) return;
  var campoV = document.getElementById("cvt"), campoN = document.getElementById("cnp");
  if(!campoV || !campoN) return;
  var tot = parseNum(campoV.value);
  var n = Math.max(1, Math.min(99, Math.round(parseNum(campoN.value) || 1)));
  var campoD = document.getElementById("cdt");
  var iso = (campoD && campoD.value) ? campoD.value : hojeISO();
  var selCartao = document.getElementById("ccc");
  var botao = sheet.querySelector('[data-cartao]');
  var cid = selCartao ? selCartao.value : (botao ? botao.dataset.cartao : null);
  var idEdit = botao ? (botao.dataset.id || null) : null;
  var ctSel = cartaoPorId(cid);
  var dicaFat = document.getElementById("dicaFatura");
  if(dicaFat) dicaFat.textContent = textoFaturaDaCompra(ctSel, iso);
  var txt = textoParcelamento(tot, n, ctSel ? faturaDaData(ctSel, iso) : iso.slice(0,7));
  if(cid && tot > 0){
    var ck = cabeNoLimite(cid, tot, idEdit, null);
    if(!ck.ok && !ck.semLimite) txt += " · passa do limite livre (" + fmt(Math.max(0, ck.livre)) + ")";
  }
  dica.textContent = txt;
}
document.addEventListener("input", function(){
  atualizarDicaParcela(); atualizarPagamento(); atualizarDicaCartao(); atualizarDicaAntecipa(); atualizarDicaEmp();
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape") fecharSheet();
  if(e.key === "Enter" && sheet.classList.contains("on")){
    var alvo = sheet.querySelector('[data-act^="salvar"]');
    if(alvo && e.target.tagName === "INPUT"){ e.preventDefault(); alvo.click(); }
  }
});

carregar();
aplicarTema();
S.aba = S.prefs.abaInicial || "mes";
render();

/* Em desenvolvimento (Live Server, localhost, arquivo aberto direto) o service worker
   só atrapalha: ele serve a cópia guardada e esconde a versão que acabou de ser salva.
   Aqui ele é desligado e qualquer registro antigo é apagado junto com o cache. */
var EM_DESENVOLVIMENTO = location.protocol === "file:" ||
  /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);

if("serviceWorker" in navigator){
  if(EM_DESENVOLVIMENTO){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
    }).catch(function(){});
    if(window.caches && caches.keys)
      caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
  }else{
    var jaTinhaControle = !!navigator.serviceWorker.controller;
    var recarregou = false;
    /* quando um build novo assume, recarrega uma vez para já mostrar a versão nova */
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(jaTinhaControle && !recarregou){ recarregou = true; location.reload(); }
    });
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        if(reg && reg.update) reg.update().catch(function(){});
      }).catch(function(){});
    });
  }
}
})();
</script>
