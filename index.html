<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ========== armazenamento ========== */
var BUILD = "2026-09-08.8";
var KEY = "finances.v1";
var KEY_ANTIGA = "reparticao.v1";   /* cópia da primeira versão, lida uma vez */
var CORES = ["#1B3A6B","#2E7D8F","#1E8E63","#7A6BB5","#C07C1E","#B23B2E","#4B5563","#8A5A3B"];
var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var SUGESTOES = ["Aluguel","Mercado","Uber","Luz","Água","Internet","Celular","Gás","Streaming","Farmácia","Combustível","Academia"];

var hoje = new Date();
var COFRE_PADRAO = {pct:20, base:"sobra", objetivo:{nome:"", valor:0}, movimentos:[]};

var S = {
  rendaModelo: [],   /* renda fixa: entra todo mês, na mesma data */
  ganhos: {},        /* mês -> [{id,nome,valor,dia,recebido}] só daquele mês */
  recebidos: {},     /* "mês|idDaFixa" -> true/false quando marcado na mão */
  particoes: [],     /* {id,nome,planejado,cor,parcelas:[{id,dia,valor}]} */
  gastos: {},
  compras: [],
  cartoes: [],       /* {id,nome,limite,vencimento,cor} */
  comprasCartao: [], /* {id,cartao,nome,total,parcelas,inicio} */
  faturas: {},       /* "idDoCartao|2026-09": true quando paga */
  emprestimos: [],   /* {id,nome,credor,valor,parcelas,valorParcela,inicio,dia,pagas,cor} */
  cofre: {pct:20, base:"sobra", objetivo:{nome:"", valor:0}, movimentos:[]},
  prefs: {tema:"auto", textoGrande:false, abaInicial:"mes"},
  mes: chaveMes(hoje),
  aba: "mes",
  verTexto: false
};
var ABAS_INICIO = [["mes","Mês"],["agenda","Agenda"],["part","Repartições"],["cartao","Cartão"],["cofre","Cofre"]];

function aplicarTema(){
  var raiz = document.documentElement;
  var t = S.prefs.tema;
  if(t === "claro" || t === "escuro") raiz.setAttribute("data-tema", t);
  else raiz.removeAttribute("data-tema");
  if(S.prefs.textoGrande) raiz.setAttribute("data-texto", "grande");
  else raiz.removeAttribute("data-texto");
  try{
    var escuro = t === "escuro" || (t !== "claro" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", escuro ? "#0F1115" : "#F2F3F5");
  }catch(e){}
}

function chaveMes(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function dataISO(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dataBR(iso){
  if(!iso) return "";
  var p = String(iso).split("-");
  return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(iso);
}
function hojeISO(){ return dataISO(new Date()); }
function mesesAtrasISO(n){
  var d = new Date();
  d.setMonth(d.getMonth() - n);
  return dataISO(d);
}
function uid(){ return Math.random().toString(36).slice(2,9); }

function aplicarDados(d){
  if(!d || typeof d !== "object") return;
  S.rendaModelo = Array.isArray(d.rendaModelo) ? d.rendaModelo : [];
  S.ganhos = (d.ganhos && typeof d.ganhos === "object") ? d.ganhos : {};
  S.recebidos = (d.recebidos && typeof d.recebidos === "object") ? d.recebidos : {};
  S.particoes = Array.isArray(d.particoes) ? d.particoes : [];
  S.gastos = (d.gastos && typeof d.gastos === "object") ? d.gastos : {};
  S.compras = Array.isArray(d.compras) ? d.compras : [];

  if(!S.rendaModelo.length && Number(d.rendaPadrao) > 0)
    S.rendaModelo = [{id:uid(), nome:"Renda", valor:Number(d.rendaPadrao), dia:5}];

  /* cópias antigas tinham uma lista mensal que substituía a fixa.
     Agora a fixa vale sempre e o mês guarda só o que entrou a mais. */
  var mensais = (d.rendas && typeof d.rendas === "object") ? d.rendas : {};
  var ehFixa = {};
  S.rendaModelo.forEach(function(r){ ehFixa[r.id] = true; });
  Object.keys(mensais).forEach(function(m){
    if(!Array.isArray(mensais[m]) || Array.isArray(S.ganhos[m])) return;
    var extras = [];
    mensais[m].forEach(function(r){
      if(!ehFixa[r.id]){ extras.push(r); return; }
      if(r.recebido === true || r.recebido === false) S.recebidos[m + "|" + r.id] = r.recebido;
    });
    if(extras.length) S.ganhos[m] = extras;
  });

  /* mais antigo ainda: um número por mês. O que passar da fixa vira ganho. */
  if(!Object.keys(mensais).length){
    var numeros = (d.renda && typeof d.renda === "object") ? d.renda : {};
    var fixaTotal = totalRendas(S.rendaModelo);
    Object.keys(numeros).forEach(function(m){
      var dif = (Number(numeros[m]) || 0) - fixaTotal;
      if(dif > 0.005 && !Array.isArray(S.ganhos[m]))
        S.ganhos[m] = [{id:uid(), nome:"Complemento", valor:dif, dia:5}];
    });
  }

  S.particoes.forEach(function(p){
    if(!Array.isArray(p.parcelas)) p.parcelas = [];
  });

  S.cartoes = Array.isArray(d.cartoes) ? d.cartoes : [];
  S.comprasCartao = Array.isArray(d.comprasCartao) ? d.comprasCartao : [];
  S.faturas = (d.faturas && typeof d.faturas === "object") ? d.faturas : {};
  S.comprasCartao.forEach(function(c){
    c.parcelas = Math.max(1, Math.round(Number(c.parcelas)||1));
    c.total = Number(c.total)||0;
    if(!c.inicio) c.inicio = mesAtual();
  });

  S.emprestimos = Array.isArray(d.emprestimos) ? d.emprestimos : [];
  S.emprestimos.forEach(function(e){
    e.parcelas = Math.max(1, Math.round(Number(e.parcelas)||1));
    e.valorParcela = Number(e.valorParcela)||0;
    if(!e.pagas || typeof e.pagas !== "object") e.pagas = {};
    if(!e.inicio) e.inicio = mesAtual();
  });

  var cf = (d.cofre && typeof d.cofre === "object") ? d.cofre : {};
  S.cofre = {
    pct: isNaN(Number(cf.pct)) ? COFRE_PADRAO.pct : Math.max(0, Math.min(100, Number(cf.pct))),
    base: cf.base === "renda" ? "renda" : "sobra",
    objetivo: (cf.objetivo && typeof cf.objetivo === "object")
      ? {nome:String(cf.objetivo.nome||""), valor:Number(cf.objetivo.valor)||0}
      : {nome:"", valor:0},
    movimentos: Array.isArray(cf.movimentos) ? cf.movimentos : []
  };

  var pf = (d.prefs && typeof d.prefs === "object") ? d.prefs : {};
  S.prefs = {
    tema: (pf.tema === "claro" || pf.tema === "escuro") ? pf.tema : "auto",
    textoGrande: pf.textoGrande === true,
    abaInicial: ABAS_INICIO.some(function(x){ return x[0] === pf.abaInicial; }) ? pf.abaInicial : "mes"
  };
}

function totalRendas(arr){
  return (arr||[]).reduce(function(t,r){ return t + (Number(r.valor)||0); }, 0);
}
function dados(){
  var legado = {}, vistos = {};
  Object.keys(S.ganhos).forEach(function(m){ vistos[m] = true; });
  Object.keys(S.gastos).forEach(function(m){ vistos[m] = true; });
  Object.keys(vistos).forEach(function(m){ legado[m] = rendaDoMes(m); });
  return {
    v:4,
    rendaModelo:S.rendaModelo, ganhos:S.ganhos, recebidos:S.recebidos,
    renda:legado, rendaPadrao:totalRendas(S.rendaModelo),
    particoes:S.particoes, gastos:S.gastos, compras:S.compras,
    cartoes:S.cartoes, comprasCartao:S.comprasCartao, faturas:S.faturas,
    emprestimos:S.emprestimos, cofre:S.cofre, prefs:S.prefs
  };
}

function carregar(){
  try{
    var raw = localStorage.getItem(KEY);
    var veioDaAntiga = false;
    if(!raw){
      raw = localStorage.getItem(KEY_ANTIGA);
      veioDaAntiga = !!raw;
    }
    if(!raw) return;
    aplicarDados(JSON.parse(raw));
    if(veioDaAntiga) salvar();
  }catch(e){}
}
function salvar(){
  try{
    localStorage.setItem(KEY, JSON.stringify(dados()));
  }catch(e){ toast("Não consegui salvar. O armazenamento do navegador está cheio ou bloqueado."); }
}

/* ========== números ========== */
function fmt(n){
  return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2});
}
function fmtCurto(n){
  n = Number(n)||0;
  return (n < 0 ? "-R$ " : "R$ ") + Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0});
}
function parseNum(txt){
  if(txt === null || txt === undefined) return 0;
  txt = String(txt).trim().replace(/[R$\s]/g,"");
  if(!txt) return 0;
  if(txt.indexOf(",") > -1) txt = txt.replace(/\./g,"").replace(",",".");
  var n = parseFloat(txt);
  return isNaN(n) ? 0 : n;
}

/* ========== cálculo do mês ========== */
function mesAtual(){ return chaveMes(new Date()); }
function mesVizinho(m, k){
  var p = m.split("-");
  return chaveMes(new Date(+p[0], (+p[1]-1)+k, 1));
}
function diasNoMes(m){ var p = m.split("-"); return new Date(+p[0], +p[1], 0).getDate(); }
function diaDeHoje(m){ var a = new Date(); return chaveMes(a) === m ? a.getDate() : null; }
function limitaDia(m, dia){ return Math.min(Math.max(1, Math.round(Number(dia)||1)), diasNoMes(m)); }

/* ---- renda fixa e ganhos do mês ---- */
function fixosDoMes(m){
  return (S.rendaModelo || []).map(function(r){
    return {id:r.id, nome:r.nome, valor:Number(r.valor)||0, dia:limitaDia(m, r.dia), fixa:true};
  });
}
function ganhosDoMes(m){
  return Array.isArray(S.ganhos[m]) ? S.ganhos[m] : [];
}
function rendasDoMes(m){
  var lista = fixosDoMes(m).concat(ganhosDoMes(m).map(function(g){
    return {id:g.id, nome:g.nome, valor:Number(g.valor)||0, dia:limitaDia(m, g.dia), recebido:g.recebido, fixa:false};
  }));
  lista.sort(function(a,c){ return a.dia - c.dia; });
  return lista;
}
function rendaRecebida(m, r){
  var marca = r.fixa ? S.recebidos[m + "|" + r.id] : r.recebido;
  if(marca === true) return true;
  if(marca === false) return false;
  var hd = diaDeHoje(m);
  if(hd === null) return m < mesAtual();
  return limitaDia(m, r.dia) <= hd;
}
function rendaDoMes(m){ return totalRendas(rendasDoMes(m)); }

/* ---- gastos ---- */
function gastosDoMes(m){ return S.gastos[m] || []; }
function gastoDaParticao(m,pid){
  var t = 0, g = gastosDoMes(m);
  for(var i=0;i<g.length;i++) if(g[i].pid === pid) t += Number(g[i].valor)||0;
  return t;
}
function origemDoAvulso(m, g){
  if((g.nota || "") === "de repartição excluída") return "sobrou de uma repartição excluída";
  var daCasa = S.compras.filter(function(c){
    return c.compradoEm === m && c.nome === (g.nota || "");
  })[0];
  return daCasa ? "veio da lista da casa" : "lançado na mão";
}
function gastoDinheiroDaParticao(m, pid){
  return gastosDoMes(m).reduce(function(t,g){
    return t + ((g.pid === pid && !g.cartao) ? (Number(g.valor)||0) : 0);
  }, 0);
}
function gastosLivresDinheiro(m){
  return gastosDoMes(m).reduce(function(t,g){
    return t + ((!g.pid && !g.cartao) ? (Number(g.valor)||0) : 0);
  }, 0);
}
function meioDePagamento(g){
  if(!g || !g.cartao) return "";
  var ct = cartaoPorId(g.cartao);
  return ct ? "no cartão " + ct.nome : "no cartão";
}
function gastosLivres(m){
  var t = 0, g = gastosDoMes(m);
  for(var i=0;i<g.length;i++) if(!g[i].pid) t += Number(g[i].valor)||0;
  return t;
}
function pagoDaParcela(m, parcId){
  var t = 0, g = gastosDoMes(m);
  for(var i=0;i<g.length;i++) if(g[i].parc === parcId) t += Number(g[i].valor)||0;
  return t;
}

/* ---- repartições com datas ---- */
function parcelasDe(p){ return Array.isArray(p.parcelas) ? p.parcelas : []; }
function planejadoDe(p){
  var pc = parcelasDe(p);
  if(!pc.length) return Number(p.planejado)||0;
  return pc.reduce(function(t,x){ return t + (Number(x.valor)||0); }, 0);
}

/* ---- cartão de crédito ---- */
function mesesEntre(a, b){
  var pa = a.split("-"), pb = b.split("-");
  return (+pb[0] - +pa[0]) * 12 + (+pb[1] - +pa[1]);
}
/* A fatura fecha num dia e vence em outro. O que passa do fechamento cai na fatura
   seguinte, e o mês de uma fatura aqui é sempre o mês em que ela é paga, igual ao banco. */
function vencimentoDoCartao(ct){
  return Math.max(1, Math.min(31, Math.round(Number(ct && ct.vencimento) || 10)));
}
function fechamentoDoCartao(ct){
  var f = Math.round(Number(ct && ct.fechamento));
  if(!isNaN(f) && f >= 1 && f <= 31) return f;
  var d = vencimentoDoCartao(ct) - 7;   /* padrão: uma semana antes de vencer */
  return d >= 1 ? d : d + 31;
}
/* Quase todo cartão fecha e cobra no mesmo mês, mas alguns só cobram no mês seguinte.
   Sem essa marca, o app deduz pela ordem dos dias: vencer antes de fechar só faz
   sentido se a cobrança for no mês seguinte. */
function faturaVenceDepois(ct){
  if(ct && typeof ct.venceDepois === "boolean") return ct.venceDepois;
  return vencimentoDoCartao(ct) <= fechamentoDoCartao(ct);
}
function mesDeFechamento(ct, m){
  return faturaVenceDepois(ct) ? mesVizinho(m, -1) : m;
}
function faturaDaData(ct, iso){
  var mes = String(iso).slice(0,7), dia = Number(String(iso).slice(8,10)) || 1;
  var mFecha = dia <= fechamentoDoCartao(ct) ? mes : mesVizinho(mes, 1);
  return faturaVenceDepois(ct) ? mesVizinho(mFecha, 1) : mFecha;
}
function faturaDoDia(ct, m, dia){
  return faturaDaData(ct, m + "-" + String(limitaDia(m, dia)).padStart(2,"0"));
}
/* período de compras que uma fatura cobre, e quando ela fecha e vence */
function janelaDaFatura(ct, m){
  var F = fechamentoDoCartao(ct), V = vencimentoDoCartao(ct);
  var mFecha = mesDeFechamento(ct, m);
  var mAnterior = mesVizinho(mFecha, -1);
  var diaIni = F + 1, mIni = mAnterior;
  if(diaIni > diasNoMes(mAnterior)){ diaIni = 1; mIni = mFecha; }
  var pad = function(d, mm){ return String(limitaDia(mm, d)).padStart(2,"0") + "/" + mm.slice(5); };
  return {de: pad(diaIni, mIni), ate: pad(F, mFecha), fecha: pad(F, mFecha), vence: pad(V, m)};
}
/* a fatura de um mês ainda está aberta enquanto não passou o dia do fechamento dela */
function faturaAberta(ct, m){
  var F = fechamentoDoCartao(ct);
  var mFecha = mesDeFechamento(ct, m);
  return hojeISO() <= mFecha + "-" + String(limitaDia(mFecha, F)).padStart(2,"0");
}
function mesDaFaturaAberta(ct){ return faturaDaData(ct, hojeISO()); }
/* entre todos os cartões, a fatura aberta que vence primeiro */
function mesFaturaMaisProxima(){
  var alvo = null;
  S.cartoes.forEach(function(ct){
    var m = mesDaFaturaAberta(ct);
    if(!alvo || m < alvo) alvo = m;
  });
  return alvo;
}

/* o mês da primeira parcela vem da data da compra; compras antigas guardam o mês na mão */
function inicioDaCompra(c){
  var ct = cartaoPorId(c.cartao);
  if(ct && c.data) return faturaDaData(ct, c.data);
  return c.inicio || mesAtual();
}
function cartaoPorId(cid){
  return S.cartoes.filter(function(c){ return c.id === cid; })[0] || null;
}
function nParcelas(c){ return Math.max(1, Math.round(Number(c.parcelas)||1)); }
/* Parcelas antecipadas saem do fim da fila: foram pagas de uma vez e não caem mais em fatura nenhuma. */
function antecipadasDe(c){
  return Math.max(0, Math.min(nParcelas(c), Math.round(Number(c.antecipadas) || 0)));
}
function parcelasAtivas(c){ return Math.max(0, nParcelas(c) - antecipadasDe(c)); }
function valorAntecipado(c){
  var t = 0, n = nParcelas(c);
  for(var k = parcelasAtivas(c) + 1; k <= n; k++) t += valorParcela(c, k);
  return Math.round(t * 100) / 100;
}
/* quantas ainda dá para antecipar olhando do mês m: as que caem depois dele */
function antecipaveis(c, m){
  var ativas = parcelasAtivas(c);
  var passadas = Math.max(0, Math.min(ativas, mesesEntre(inicioDaCompra(c), m) + 1));
  return Math.max(0, ativas - passadas);
}
function valorDeAntecipar(c, n){
  var ativas = parcelasAtivas(c), t = 0;
  for(var k = Math.max(1, ativas - n + 1); k <= ativas; k++) t += valorParcela(c, k);
  return Math.round(t * 100) / 100;
}
function valorParcela(c, k){
  var n = nParcelas(c), tot = Number(c.total)||0;
  var base = Math.round(tot / n * 100) / 100;
  return k >= n ? Math.round((tot - base * (n-1)) * 100) / 100 : base;
}
function parcelaNoMes(c, m){
  var k = mesesEntre(inicioDaCompra(c), m) + 1;
  return (k >= 1 && k <= parcelasAtivas(c)) ? k : 0;
}
/* Uma fatura pode estar sem pagar, paga pela metade ou quitada. Guardamos true
   quando foi quitada de uma vez, ou o valor já pago quando foi em partes. */
function pagoDaFatura(cid, m, total){
  var v = S.faturas[cid + "|" + m];
  if(v === true) return total === undefined ? montarFatura(cid, m).total : total;
  var n = Number(v);
  return (isFinite(n) && n > 0) ? Math.round(n * 100) / 100 : 0;
}
function faturaPaga(cid, m){
  var v = S.faturas[cid + "|" + m];
  if(v === true) return true;
  var n = Number(v);
  if(!(isFinite(n) && n > 0)) return false;
  var tot = montarFatura(cid, m).total;
  return tot > 0 && n >= tot - 0.005;
}
function faturaDoCartao(cid, m){
  var f = montarFatura(cid, m);
  f.pagoValor = pagoDaFatura(cid, m, f.total);
  f.pago = f.total > 0 ? f.pagoValor >= f.total - 0.005 : f.pagoValor > 0;
  f.aberto = Math.max(0, Math.round((f.total - f.pagoValor) * 100) / 100);
  return f;
}
/* gastos comuns que foram pagos no cartão e caem na fatura deste mês.
   Um gasto entra na fatura do próprio mês ou na do seguinte, então basta olhar dois meses. */
function gastosNoCartao(cid, m){
  var achados = [];
  [mesVizinho(m, -1), m].forEach(function(mm){
    (S.gastos[mm] || []).forEach(function(g){
      if(g.cartao !== cid) return;
      if((g.fatMes || mm) !== m) return;
      achados.push({g:g, mes:mm});
    });
  });
  return achados;
}
/* a soma da fatura, sem olhar pagamento: é o que evita cair em recursão */
function montarFatura(cid, m){
  var itens = [], parcelas = 0, gastos = 0;
  S.comprasCartao.forEach(function(c){
    if(c.cartao !== cid) return;
    var k = parcelaNoMes(c, m);
    if(!k) return;
    var v = valorParcela(c, k);
    itens.push({tipo:"parcela", compra:c, n:k, de:nParcelas(c), nome:c.nome, valor:v});
    parcelas += v;
  });
  gastosNoCartao(cid, m).forEach(function(x){
    var v = Number(x.g.valor)||0;
    itens.push({tipo:"gasto", gasto:x.g, mes:x.mes, nome:x.g.nota || "gasto", valor:v});
    gastos += v;
  });
  itens.sort(function(a,b){ return b.valor - a.valor; });
  parcelas = Math.round(parcelas * 100) / 100;
  gastos = Math.round(gastos * 100) / 100;
  return {
    cid:cid, itens:itens, parcelas:parcelas, gastos:gastos,
    total: Math.round((parcelas + gastos) * 100) / 100
  };
}
function faturasDoMes(m){
  var lista = [], total = 0, pago = 0, aberto = 0, parcelas = 0, gastos = 0;
  S.cartoes.forEach(function(ct){
    var f = faturaDoCartao(ct.id, m);
    f.cartao = ct;
    lista.push(f);
    total += f.total;
    parcelas += f.parcelas;
    gastos += f.gastos;
    pago += f.pagoValor;
    aberto += f.aberto;
  });
  return {
    lista:lista, total:total, parcelas:parcelas, gastos:gastos,
    pago: Math.round(pago * 100) / 100, aberto: Math.round(aberto * 100) / 100
  };
}
function usadoDoCartao(cid, ignoraCompra, ignoraGasto){
  var t = 0;
  S.comprasCartao.forEach(function(c){
    if(c.cartao !== cid || (ignoraCompra && c.id === ignoraCompra)) return;
    t += comprometidoDaCompra(c);
  });
  Object.keys(S.gastos).forEach(function(mm){
    (S.gastos[mm] || []).forEach(function(g){
      if(g.cartao !== cid || (ignoraGasto && g.id === ignoraGasto)) return;
      if(!faturaPaga(cid, g.fatMes || mm)) t += Number(g.valor)||0;
    });
  });
  /* faturas quitadas já saíram da conta acima; falta descontar o que foi pago em partes */
  Object.keys(S.faturas).forEach(function(k){
    var p = k.split("|");
    if(p[0] !== cid || faturaPaga(cid, p[1])) return;
    t -= pagoDaFatura(cid, p[1]);
  });
  return Math.max(0, Math.round(t * 100) / 100);
}
/* o quanto de uma compra ainda ocupa limite: parcelas cujas faturas não foram pagas */
function comprometidoDaCompra(c){
  var n = parcelasAtivas(c), ini = inicioDaCompra(c), t = 0;
  for(var k=1;k<=n;k++)
    if(!faturaPaga(c.cartao, mesVizinho(ini, k-1))) t += valorParcela(c, k);
  return Math.round(t * 100) / 100;
}
/* Parte do limite pode estar convertida em reserva no banco: ela sai do total
   e deixa de valer para comprar, mesmo sem nenhuma fatura em aberto. */
function limiteConvertido(ct){ return Math.max(0, Number(ct && ct.convertido) || 0); }
function limiteTotal(ct){ return Math.max(0, Number(ct && ct.limite) || 0); }
function limiteUtil(ct){ return Math.max(0, limiteTotal(ct) - limiteConvertido(ct)); }

/* nada entra no cartão além do limite, seja de uma vez ou somando com o que já está lá */
function cabeNoLimite(cid, valor, ignoraCompra, ignoraGasto){
  var ct = cartaoPorId(cid);
  if(!ct) return {ok:true, livre:0, falta:0};
  var lim = limiteUtil(ct);
  if(limiteTotal(ct) <= 0) return {ok:true, semLimite:true, livre:0, falta:0};
  var livre = Math.round((lim - usadoDoCartao(cid, ignoraCompra, ignoraGasto)) * 100) / 100;
  return {ok: valor <= livre + 0.005, livre:livre, falta: Math.round((valor - livre) * 100) / 100, limite:lim};
}
function recusaLimite(ck, cid){
  var ct = cartaoPorId(cid);
  return "Não cabe no " + (ct ? ct.nome : "cartão") + ": livre " + fmt(Math.max(0, ck.livre)) +
    ", faltam " + fmt(ck.falta);
}
function limiteLivre(ct){ return limiteUtil(ct) - usadoDoCartao(ct.id); }
function situacaoCompra(c, m){
  var n = nParcelas(c), ativas = parcelasAtivas(c), ini = inicioDaCompra(c);
  var pagas = 0, restante = 0;
  for(var k=1;k<=ativas;k++){
    if(faturaPaga(c.cartao, mesVizinho(ini, k-1))) pagas++;
    else restante += valorParcela(c, k);
  }
  return {
    n:n, ativas:ativas, antecipadas:antecipadasDe(c),
    pagas:pagas + antecipadasDe(c), k:parcelaNoMes(c, m),
    restante:Math.round(restante * 100) / 100,
    valor:valorParcela(c, 1),
    inicio:ini, fim:mesVizinho(ini, Math.max(0, ativas-1)),
    quitada: pagas >= ativas, futura: ini > m
  };
}
function compromissoFuturo(cid, m){
  var t = 0, ultimo = null;
  S.comprasCartao.forEach(function(c){
    if(cid && c.cartao !== cid) return;
    var n = parcelasAtivas(c), ini = inicioDaCompra(c);
    for(var k=1;k<=n;k++){
      var mm = mesVizinho(ini, k-1);
      if(mm > m){ t += valorParcela(c, k); if(!ultimo || mm > ultimo) ultimo = mm; }
    }
  });
  return {total:Math.round(t * 100) / 100, ultimo:ultimo};
}

/* ---- empréstimos ---- */
function nParcelasEmp(e){ return Math.max(1, Math.round(Number(e.parcelas)||1)); }
function valorParcelaEmp(e){ return Number(e.valorParcela)||0; }
function parcelaEmprestimo(e, m){
  var k = mesesEntre(e.inicio || m, m) + 1;
  return (k >= 1 && k <= nParcelasEmp(e)) ? k : 0;
}
function parcelaEmpPaga(e, m){ return !!(e.pagas && e.pagas[m] === true); }
function emprestimosDoMes(m){
  var itens = [], total = 0, pago = 0;
  S.emprestimos.forEach(function(e){
    var k = parcelaEmprestimo(e, m);
    if(!k) return;
    var v = valorParcelaEmp(e), p = parcelaEmpPaga(e, m);
    itens.push({emp:e, n:k, de:nParcelasEmp(e), valor:v, pago:p, dia:limitaDia(m, e.dia || 10)});
    total += v;
    if(p) pago += v;
  });
  itens.sort(function(a,b){ return a.dia - b.dia; });
  return {
    itens:itens,
    total: Math.round(total * 100) / 100,
    pago: Math.round(pago * 100) / 100,
    aberto: Math.round((total - pago) * 100) / 100
  };
}
/* o que ainda falta pagar de um empréstimo, contando só as parcelas não quitadas */
function saldoEmprestimo(e){
  var n = nParcelasEmp(e), ini = e.inicio || mesAtual(), pagas = 0;
  for(var k=1;k<=n;k++) if(parcelaEmpPaga(e, mesVizinho(ini, k-1))) pagas++;
  return {
    pagas:pagas, restam:n - pagas,
    saldo: Math.round((n - pagas) * valorParcelaEmp(e) * 100) / 100,
    total: Math.round(n * valorParcelaEmp(e) * 100) / 100,
    fim: mesVizinho(ini, n-1)
  };
}
function dividaTotal(){
  return Math.round(S.emprestimos.reduce(function(t,e){ return t + saldoEmprestimo(e).saldo; }, 0) * 100) / 100;
}

/* ---- cofrinho ---- */
function movimentosCofre(m){
  return (S.cofre.movimentos||[]).filter(function(x){ return x.mes === m; });
}
function guardadoNoMes(m){
  return movimentosCofre(m).reduce(function(t,x){ return t + (Number(x.valor)||0); }, 0);
}
function totalCofre(){
  return (S.cofre.movimentos||[]).reduce(function(t,x){ return t + (Number(x.valor)||0); }, 0);
}
function pctCofre(){
  var p = Number(S.cofre.pct);
  return isNaN(p) ? 0 : Math.max(0, Math.min(100, p));
}
function baseCofre(b){
  return S.cofre.base === "renda" ? b.renda : Math.max(0, b.sobraBruta);
}
function sugestaoCofre(b){
  return Math.round(baseCofre(b) * pctCofre()) / 100;
}

function balanco(m){
  var rs = rendasDoMes(m);
  var renda = 0, jaEntrou = 0;
  rs.forEach(function(r){
    var v = Number(r.valor)||0;
    renda += v;
    if(rendaRecebida(m, r)) jaEntrou += v;
  });
  var comprometido = 0, jaSaiu = 0, aindaSai = 0, planejado = 0;
  var linhas = S.particoes.map(function(p){
    var g = gastoDaParticao(m, p.id);
    var plan = planejadoDe(p);
    comprometido += Math.max(plan, g);
    jaSaiu += gastoDinheiroDaParticao(m, p.id);
    aindaSai += Math.max(0, plan - g);
    planejado += plan;
    return {p:p, gasto:g, planejado:plan};
  });
  var livres = gastosLivres(m);
  jaSaiu += gastosLivresDinheiro(m);

  /* Só as parcelas de compras entram como compromisso novo: um gasto pago no cartão
     já foi contado na repartição dele ou nos avulsos, e contar de novo dobraria o valor. */
  var fat = faturasDoMes(m);
  comprometido += fat.parcelas;
  jaSaiu += fat.pago;
  aindaSai += fat.aberto;

  var emp = emprestimosDoMes(m);
  comprometido += emp.total;
  jaSaiu += emp.pago;
  aindaSai += emp.aberto;

  var guardado = guardadoNoMes(m);
  jaSaiu += guardado;

  var sobraBruta = renda - comprometido - livres;
  return {
    renda:renda, rendas:rs, jaEntrou:jaEntrou, aindaEntra:renda - jaEntrou,
    linhas:linhas, planejado:planejado,
    comprometido:comprometido, livres:livres,
    fatura:fat, emprestimo:emp, guardado:guardado,
    jaSaiu:jaSaiu, aindaSai:aindaSai,
    sobraBruta:sobraBruta,
    sobra: sobraBruta - guardado
  };
}
function diasRestantes(m){
  var p = m.split("-"), ano = +p[0], mes = +p[1];
  var agora = new Date();
  if(chaveMes(agora) !== m) return 0;
  var ultimo = new Date(ano, mes, 0).getDate();
  return Math.max(1, ultimo - agora.getDate() + 1);
}

/* ========== histórico ========== */
function temRegistro(m){
  if(ganhosDoMes(m).length) return true;
  if((S.gastos[m] || []).length) return true;
  if(movimentosCofre(m).length) return true;
  if(faturasDoMes(m).total > 0) return true;
  return false;
}
function mesesDoHistorico(ate, n){
  var lista = [];
  for(var k = n-1; k >= 0; k--) lista.push(mesVizinho(ate, -k));
  return lista;
}
function tamanhoDados(){
  var txt = JSON.stringify(dados());
  return {caracteres:txt.length, kb: txt.length * 2 / 1024};
}
/* mantém os 12 meses que terminam no mês corrente e joga fora o resto */
function limparAntigos(){
  var corte = mesVizinho(mesAtual(), -11);
  var n = 0;

  Object.keys(S.gastos).forEach(function(m){
    if(m < corte){ n += (S.gastos[m] || []).length; delete S.gastos[m]; }
  });
  Object.keys(S.ganhos).forEach(function(m){
    if(m < corte){ n += (S.ganhos[m] || []).length; delete S.ganhos[m]; }
  });
  Object.keys(S.recebidos).forEach(function(k){
    var mm = k.split("|")[0];
    if(mm && mm < corte) delete S.recebidos[k];
  });
  /* as compras quitadas saem antes das faturas, que são a prova de pagamento */
  S.comprasCartao = S.comprasCartao.filter(function(c){
    var np = parcelasAtivas(c), ini = inicioDaCompra(c), apagar = true;
    for(var k=1;k<=np;k++){
      var mm = mesVizinho(ini, k-1);
      if(mm >= corte || !faturaPaga(c.cartao, mm)){ apagar = false; break; }
    }
    if(apagar) n++;
    return !apagar;
  });

  Object.keys(S.faturas).forEach(function(k){
    var mm = k.split("|")[1];
    if(mm && mm < corte){ delete S.faturas[k]; n++; }
  });

  /* o saldo do cofrinho é preservado num lançamento sem mês */
  var somaAntiga = 0, restantes = [];
  (S.cofre.movimentos || []).forEach(function(x){
    if(x.mes && x.mes < corte){ somaAntiga += Number(x.valor)||0; n++; }
    else restantes.push(x);
  });
  if(Math.abs(somaAntiga) > 0.005)
    restantes.unshift({id:uid(), mes:"inicial", valor:somaAntiga, nota:"saldo juntado antes do corte", dia:""});
  S.cofre.movimentos = restantes;

  var antesCompras = S.compras.length;
  S.compras = S.compras.filter(function(c){ return !(c.compradoEm && c.compradoEm < corte); });
  n += antesCompras - S.compras.length;

  return {n:n, corte:corte};
}

/* ========== agenda e projeção de caixa ========== */
function agendaDoMes(m){
  var evs = [];
  rendasDoMes(m).forEach(function(r){
    evs.push({
      tipo:"in", dia:limitaDia(m, r.dia), nome:r.nome || "Recebimento",
      valor:Number(r.valor)||0, feito:rendaRecebida(m, r),
      rid:r.id, fixa:!!r.fixa
    });
  });
  S.particoes.forEach(function(p){
    parcelasDe(p).forEach(function(pc){
      var v = Number(pc.valor)||0;
      var pago = pagoDaParcela(m, pc.id);
      evs.push({
        tipo:"out", dia:limitaDia(m, pc.dia), nome:p.nome, valor:v,
        pago:pago, restante:Math.max(0, v - pago), feito: pago >= v - 0.005,
        pid:p.id, parc:pc.id, cor:p.cor
      });
    });
  });
  emprestimosDoMes(m).itens.forEach(function(x){
    evs.push({
      tipo:"emp", dia:x.dia, nome:x.emp.nome || "Empréstimo",
      valor:x.valor, restante: x.pago ? 0 : x.valor, feito:x.pago,
      eid:x.emp.id, k:x.n, de:x.de, cor:x.emp.cor
    });
  });
  S.cartoes.forEach(function(ct){
    var f = faturaDoCartao(ct.id, m);
    if(f.total <= 0) return;
    evs.push({
      tipo:"fatura", dia:limitaDia(m, ct.vencimento || 10),
      nome:"Fatura " + ct.nome, valor:f.total,
      restante: f.pago ? 0 : f.total, feito:f.pago,
      cid:ct.id, cor:ct.cor, itens:f.itens.length
    });
  });
  evs.sort(function(a,c){
    return a.dia - c.dia || (a.tipo === c.tipo ? 0 : (a.tipo === "in" ? -1 : 1));
  });
  return evs;
}

/* caixa de hoje = o que já entrou menos o que já saiu; daí anda evento a evento */
function projecao(m, b){
  b = b || balanco(m);
  var evs = agendaDoMes(m);
  var caixa = b.jaEntrou - b.jaSaiu;
  var saldo = caixa, pontos = [], pior = null;
  evs.forEach(function(e){
    var delta = e.tipo === "in" ? (e.feito ? 0 : e.valor) : -e.restante;
    saldo += delta;
    pontos.push({ev:e, delta:delta, saldo:saldo});
    if(delta < 0 && (pior === null || saldo < pior.saldo))
      pior = {saldo:saldo, dia:e.dia, nome:e.nome, ev:e};
  });
  var semData = 0;
  S.particoes.forEach(function(p){
    if(parcelasDe(p).length) return;
    semData += Math.max(0, planejadoDe(p) - gastoDaParticao(m, p.id));
  });
  return {caixa:caixa, pontos:pontos, pior:pior, semData:semData, fim:saldo - semData};
}

/* ========== conselhos ========== */
function mediaHistorica(pid, m, n){
  var soma = 0, c = 0;
  for(var i=1;i<=n;i++){
    var mm = mesVizinho(m, -i);
    if(!S.gastos[mm]) continue;
    var g = gastoDaParticao(mm, pid);
    if(g > 0){ soma += g; c++; }
  }
  return c ? {media:soma/c, meses:c} : null;
}

function conselhos(m, b){
  var out = [];
  var at = function(t, act, d){ return {t:t, act:act, d:d || {}}; };
  var temCofre = totalCofre() > 0.5;
  var hd = diaDeHoje(m);
  var dm = diasNoMes(m);
  var passado = m < mesAtual();
  var pj = projecao(m, b);
  var pendentes = S.compras.filter(function(c){ return !c.compradoEm; })
    .sort(function(a,c){ return (c.prio||2)-(a.prio||2) || (Number(a.preco)||0)-(Number(c.preco)||0); });

  if(b.renda <= 0){
    out.push({n:"dica", t:"Falta dizer quanto entra",
      c:"renda",
      x:"Sem renda cadastrada não dá pra calcular sobra nenhuma. Cadastre a renda fixa com o dia em que ela cai. O que entrar fora disso vira ganho do mês.",
      a:[at("Cadastrar renda fixa", "nova-fixa"), at("Ganho deste mês", "novo-ganho")]});
    if(!S.cartoes.length && !S.particoes.length) return out;
  }

  /* estouro do mês */
  if(b.sobra < -0.5){
    var pior = null;
    b.linhas.forEach(function(l){
      var d = l.gasto - l.planejado;
      if(d > 0.5 && (!pior || d > pior.d)) pior = {nome:l.p.nome, id:l.p.id, d:d};
    });
    var t = "Faltam " + fmt(-b.sobra) + " pra fechar o mês no zero. ";
    if(pior) t += "O maior desvio é " + esc(pior.nome) + ", " + fmt(pior.d) + " acima do planejado. ";
    if(b.livres > 0) t += "Gastos avulsos somam " + fmt(b.livres) + " e são a parte mais fácil de segurar. ";
    if(pendentes.length) t += "Adiar " + esc(pendentes[0].nome) + " (" + fmt(pendentes[0].preco) + ") já reduz o buraco.";
    var aEst = [];
    if(pior) aEst.push(at("Ver " + esc(pior.nome), "abrir-part", {id:pior.id}));
    if(b.livres > 0) aEst.push(at("Ver gastos avulsos", "ver-avulsos"));
    if(temCofre) aEst.push(at("Resgatar do cofrinho", "resgatar"));
    if(pendentes.length) aEst.push(at("Rever " + esc(pendentes[0].nome), "abrir-item", {id:pendentes[0].id}));
    aEst.push(at("Ganho deste mês", "novo-ganho"));
    aEst.push(at("Ver agenda", "ir-aba", {aba:"agenda"}));
    out.push({n:"alerta", t:"Você passou do que entra", x:t, a:aEst});
  }

  /* buraco de caixa numa data específica */
  if(!passado && pj.pior && pj.pior.saldo < -0.5){
    var prox = null;
    pj.pontos.forEach(function(pt){
      if(!prox && pt.ev.tipo === "in" && !pt.ev.feito && pt.ev.dia >= pj.pior.dia) prox = pt.ev;
    });
    var aBur = [], evP = pj.pior.ev;
    if(evP && evP.tipo === "out" && evP.pid) aBur.push(at("Mudar a data de " + esc(evP.nome), "abrir-part", {id:evP.pid}));
    if(evP && evP.tipo === "fatura") aBur.push(at("Ver cartão", "ir-aba", {aba:"cartao"}));
    if(prox) aBur.push(at("Antecipar " + esc(prox.nome), prox.fixa ? "abrir-fixo" : "abrir-ganho", {id:prox.rid}));
    if(temCofre) aBur.push(at("Resgatar do cofrinho", "resgatar"));
    aBur.push(at("Ver agenda", "ir-aba", {aba:"agenda"}));
    out.push({n:"alerta", t:"Falta caixa no dia " + pj.pior.dia, a:aBur,
      x:"Na ordem em que as contas caem, o saldo chega a " + fmt(pj.pior.saldo) + " depois de " + esc(pj.pior.nome) + ". " +
        (prox
          ? "O próximo dinheiro entra dia " + prox.dia + " (" + esc(prox.nome) + ", " + fmt(prox.valor) + "). Ou essa conta muda pra depois do dia " + prox.dia + ", ou parte do recebimento precisa ser antecipada."
          : "Não entra mais nada até o fim do mês, então essa conta precisa mudar de data ou de valor.")});
  }

  /* vencimentos atrasados e a vencer */
  if(hd !== null){
    pj.pontos.forEach(function(pt){
      var e = pt.ev;
      if(e.tipo !== "out" || e.feito) return;
      if(e.dia < hd){
        out.push({n:"alerta", t:esc(e.nome) + " venceu dia " + e.dia,
          x:"Ainda faltam " + fmt(e.restante) + " e a data já passou. Se você pagou por fora, lance o pagamento aqui pra conta sumir da agenda.",
          a:[at("Lançar o pagamento", "abrir-part", {id:e.pid}), at("Ver agenda", "ir-aba", {aba:"agenda"})]});
      }else if(e.dia - hd <= 3){
        out.push({n:"atencao", t:esc(e.nome) + " vence dia " + e.dia,
          x:(e.dia === hd ? "Vence hoje" : "Faltam " + (e.dia-hd) + " dia" + (e.dia-hd > 1 ? "s" : "")) +
            ": " + fmt(e.restante) + ". Antes dela o caixa projetado é " + fmt(pt.saldo - pt.delta) + ".",
          a:[at("Abrir " + esc(e.nome), "abrir-part", {id:e.pid}), at("Ver agenda", "ir-aba", {aba:"agenda"})]});
      }
    });
  }

  /* ritmo de consumo das repartições */
  if(hd !== null && hd / dm >= 0.25){
    var pctTempo = hd / dm;
    b.linhas.forEach(function(l){
      if(l.planejado <= 0 || l.gasto <= 0) return;
      var pctGasto = l.gasto / l.planejado;
      if(pctGasto >= 1 || pctGasto <= pctTempo + 0.15) return;
      var dias = Math.max(1, dm - hd);
      out.push({n:"atencao", t:esc(l.p.nome) + " está indo rápido",
        x:"Já foram " + fmt(l.gasto) + " de " + fmt(l.planejado) + " com " + Math.round(pctTempo*100) + "% do mês corrido. Nesse ritmo fecha em " + fmt(l.gasto/pctTempo) +
          ". Pra caber no planejado dá " + fmt((l.planejado-l.gasto)/dias) + " por dia nos " + dias + " dias que faltam.",
        a:[at("Abrir " + esc(l.p.nome), "abrir-part", {id:l.p.id}), at("Ver histórico", "ir-aba", {aba:"historico"})]});
    });
  }

  /* repartição estourada quando o mês ainda fecha */
  if(b.sobra >= -0.5){
    b.linhas.forEach(function(l){
      var d = l.gasto - l.planejado;
      if(d <= 0.5) return;
      out.push({n:"atencao", t:esc(l.p.nome) + " estourou " + fmt(d),
        x:"O mês ainda fecha porque outras repartições sobraram. Se " + fmt(l.gasto) + " virou o normal, sobe o planejado: a sobra da tela inicial fica mais honesta.",
        a:[at("Ajustar " + esc(l.p.nome), "abrir-part", {id:l.p.id}), at("Ver histórico", "ir-aba", {aba:"historico"})]});
    });
  }

  /* planejado defasado frente ao histórico */
  b.linhas.forEach(function(l){
    if(l.planejado <= 0) return;
    var h = mediaHistorica(l.p.id, m, 3);
    if(!h || h.meses < 2 || h.media <= l.planejado * 1.1) return;
    out.push({n:"dica", t:"O planejado de " + esc(l.p.nome) + " está defasado",
      x:"Nos últimos " + h.meses + " meses você gastou em média " + fmt(h.media) + ", contra " + fmt(l.planejado) + " reservados. Ajustar pra perto de " + fmt(h.media) + " evita a mesma surpresa todo mês.",
      a:[at("Ajustar " + esc(l.p.nome), "abrir-part", {id:l.p.id}), at("Ver histórico", "ir-aba", {aba:"historico"})]});
  });

  /* renda ainda por entrar */
  if(!passado && b.aindaEntra > 0.5){
    var proxima = null;
    pj.pontos.forEach(function(pt){ if(!proxima && pt.ev.tipo === "in" && !pt.ev.feito) proxima = pt.ev; });
    if(proxima)
      out.push({n:"dica", t:"Ainda entra " + fmt(b.aindaEntra) + " neste mês", c:"renda",
        x:"O próximo é " + esc(proxima.nome) + ", dia " + proxima.dia + " (" + fmt(proxima.valor) + "). Até lá o caixa é " + fmt(pj.caixa) + ", e tudo que vence antes disso precisa caber aí.",
        a:[at("Abrir " + esc(proxima.nome), proxima.fixa ? "abrir-fixo" : "abrir-ganho", {id:proxima.rid}), at("Ver agenda", "ir-aba", {aba:"agenda"})]});
  }

  /* avulsos pesando */
  if(b.renda > 0 && b.livres > b.renda * 0.2)
    out.push({n:"atencao", t:"Gastos avulsos já são " + Math.round(b.livres/b.renda*100) + "% da renda",
      x:fmt(b.livres) + " saíram fora de qualquer repartição. Quando isso se repete, vale criar uma repartição com nome e teto: o que não tem nome não tem limite.",
      a:[at("Ver gastos avulsos", "ver-avulsos"), at("Criar repartição", "nova-part")]});

  /* compras da casa */
  if(b.sobra > 0.5 && pendentes.length){
    var cabem = pendentes.filter(function(c){ return (Number(c.preco)||0) <= b.sobra; });
    if(cabem.length){
      out.push({n:"boa", t:"Dá pra comprar " + esc(cabem[0].nome),
        x:"Custa " + fmt(cabem[0].preco) + " e sobram " + fmt(b.sobra) + " depois de reservar tudo. Depois da compra ainda ficam " + fmt(b.sobra - (Number(cabem[0].preco)||0)) + ".",
        a:[at("Marcar como comprado", "abrir-item", {id:cabem[0].id}), at("Ver a lista", "ir-aba", {aba:"casa"})]});
    }else{
      var alvo = pendentes[0], falta = (Number(alvo.preco)||0) - b.sobra;
      out.push({n:"dica", t:esc(alvo.nome) + " ainda não cabe",
        x:"Faltam " + fmt(falta) + ". Guardando uma sobra como a deste mês (" + fmt(b.sobra) + "), são cerca de " + (Math.ceil(falta/b.sobra)+1) + " meses até esse item.",
        a:[at("Guardar no cofrinho", "guardar"), at("Ver a lista", "ir-aba", {aba:"casa"})]});
    }
  }

  /* fim de mês com folga */
  var dias = diasRestantes(m);
  if(hd !== null && dias <= 7 && b.sobra > 0.5 && !pendentes.length)
    out.push({n:"boa", t:"Mês fechando com " + fmt(b.sobra),
      x:"Faltam " + dias + " dia" + (dias > 1 ? "s" : "") + ". Se nada grande aparecer, esse dinheiro rende mais na reserva do que virando gasto de fim de mês.",
      a:[at("Guardar no cofrinho", "guardar")]});

  /* ---- cartão de crédito ---- */
  var antesCartao = out.length;
  S.cartoes.forEach(function(ct){
    var f = faturaDoCartao(ct.id, m);
    var dia = limitaDia(m, ct.vencimento || 10);

    if(f.total > 0 && !f.pago && hd !== null){
      var ptF = null;
      pj.pontos.forEach(function(pt){ if(!ptF && pt.ev.tipo === "fatura" && pt.ev.cid === ct.id) ptF = pt; });
      if(dia < hd){
        out.push({n:"alerta", t:"Fatura do " + esc(ct.nome) + " venceu dia " + dia,
          x:fmt(f.total) + " em " + f.itens.length + (f.itens.length === 1 ? " parcela" : " parcelas") +
            ", sem baixa até agora. Juros de cartão são o dinheiro mais caro que existe. Se já pagou, marque como paga para o limite voltar.",
          a:[at("Pagar fatura", "pagar-fatura", {id:ct.id, mes:m}), at("Ver cartão", "ir-aba", {aba:"cartao"})].concat(temCofre ? [at("Resgatar do cofrinho", "resgatar")] : [])});
      }else if(dia - hd <= 5){
        out.push({n:"atencao", t:"Fatura do " + esc(ct.nome) + " vence dia " + dia,
          x:fmt(f.total) + (dia === hd ? " vencem hoje" : " em " + (dia-hd) + " dia" + (dia-hd > 1 ? "s" : "")) + "." +
            (ptF ? " Antes dela o caixa projetado é " + fmt(ptF.saldo - ptF.delta) + "." : ""),
          a:[at("Pagar fatura", "pagar-fatura", {id:ct.id, mes:m}), at("Ver cartão", "ir-aba", {aba:"cartao"})]});
      }else{
        out.push({n:"dica", t:"Fatura do " + esc(ct.nome) + " em " + fmt(f.total),
          x:"Vence dia " + dia + ", daqui a " + (dia - hd) + " dias. " +
            (b.sobra >= 0
              ? "O orçamento do mês já reserva esse valor."
              : "Como o mês está " + fmt(b.sobra) + ", essa fatura ainda não tem de onde sair."),
          a:[at("Ver cartão", "ir-aba", {aba:"cartao"})].concat(b.sobra < 0 && temCofre ? [at("Resgatar do cofrinho", "resgatar")] : [])});
      }
    }

    var lim = limiteUtil(ct);
    if(lim > 0){
      var usado = usadoDoCartao(ct.id);
      if(usado >= lim)
        out.push({n:"alerta", t:"Limite do " + esc(ct.nome) + " estourado",
          x:"São " + fmt(usado) + " comprometidos num limite de " + fmt(lim) + ". Só o pagamento das faturas devolve espaço.",
          a:[at("Ver cartão", "ir-aba", {aba:"cartao"})]});
      else if(usado / lim >= 0.8)
        out.push({n:"atencao", t:"Limite do " + esc(ct.nome) + " em " + Math.round(usado/lim*100) + "%",
          x:"Sobram " + fmt(lim - usado) + " de " + fmt(lim) + ". Cada fatura paga devolve limite; parcelar de novo agora prende o cartão por mais meses.",
          a:[at("Ver cartão", "ir-aba", {aba:"cartao"})]});
    }
  });

  if(b.renda > 0 && b.fatura.total > b.renda * 0.35)
    out.push({n:"atencao", t:"O cartão leva " + Math.round(b.fatura.total/b.renda*100) + "% da renda",
      x:"A fatura deste mês soma " + fmt(b.fatura.total) + ". Enquanto as parcelas antigas não terminam, cada compra nova empilha em cima dessa conta.",
      a:[at("Ver compras do cartão", "ir-aba", {aba:"cartao"})]});

  S.comprasCartao.forEach(function(c){
    var n = nParcelas(c);
    if(n < 2) return;
    var k = parcelaNoMes(c, m);
    if(k !== n) return;
    out.push({n:"boa", t:"Última parcela de " + esc(c.nome),
      x:"A " + k + "ª de " + n + " sai neste mês. A partir de " + nomeMes(mesVizinho(m, 1)) + " são " + fmt(valorParcela(c, k)) + " a menos de fatura por mês.",
      a:[at("Ver compra", "abrir-compra", {id:c.id})]});
  });

  var cfut = compromissoFuturo(null, m);
  if(cfut.total > 0.5 && b.renda > 0 && cfut.total > b.renda)
    out.push({n:"dica", t:"Parcelas futuras somam " + fmt(cfut.total),
      x:"É mais de uma renda inteira já comprometida, com a última parcela em " + nomeMes(cfut.ultimo) + ". Antes de parcelar outra coisa, veja se a parcela cabe em todos esses meses, não só neste.",
      a:[at("Ver cartão", "ir-aba", {aba:"cartao"})]});

  for(var ic = antesCartao; ic < out.length; ic++) out[ic].c = "cartao";

  /* ---- empréstimos ---- */
  var antesEmp = out.length;
  var empMes = b.emprestimo;
  empMes.itens.forEach(function(x){
    if(x.pago || hd === null) return;
    if(x.dia < hd)
      out.push({n:"alerta", t:esc(x.emp.nome || "Empréstimo") + " venceu dia " + x.dia,
        x:"A parcela " + x.n + " de " + x.de + ", de " + fmt(x.valor) + ", não foi marcada como paga. Atraso em empréstimo costuma custar juros e multa no mesmo dia.",
        a:[at("Marcar paga", "pagar-emprestimo", {id:x.emp.id}), at("Ver empréstimos", "ir-aba", {aba:"emprestimo"})]});
    else if(x.dia - hd <= 3)
      out.push({n:"atencao", t:esc(x.emp.nome || "Empréstimo") + " vence dia " + x.dia,
        x:fmt(x.valor) + (x.dia === hd ? " vencem hoje" : " em " + (x.dia-hd) + " dia" + (x.dia-hd > 1 ? "s" : "")) + ".",
        a:[at("Marcar paga", "pagar-emprestimo", {id:x.emp.id}), at("Ver agenda", "ir-aba", {aba:"agenda"})]});
  });
  if(b.renda > 0 && empMes.total > b.renda * 0.3)
    out.push({n:"atencao", t:"Empréstimos levam " + Math.round(empMes.total/b.renda*100) + "% da renda",
      x:"São " + fmt(empMes.total) + " por mês só de parcela. Enquanto isso não baixa, sobra pouco para o resto.",
      a:[at("Ver empréstimos", "ir-aba", {aba:"emprestimo"})]});
  S.emprestimos.forEach(function(e){
    var s = saldoEmprestimo(e);
    if(s.restam !== 1) return;
    out.push({n:"boa", t:"Última parcela de " + esc(e.nome || "empréstimo"),
      x:"Falta só " + fmt(valorParcelaEmp(e)) + " e essa dívida acaba. A partir daí esse valor volta para o mês.",
      a:[at("Ver empréstimos", "ir-aba", {aba:"emprestimo"})]});
  });
  var divida = dividaTotal();
  if(divida > 0.5 && b.renda > 0 && divida > b.renda * 3)
    out.push({n:"dica", t:"Você ainda deve " + fmt(divida),
      x:"É mais de três meses de renda em dívida. Vale comparar os juros de cada uma antes de pegar qualquer coisa nova.",
      a:[at("Ver empréstimos", "ir-aba", {aba:"emprestimo"})]});
  for(var ie = antesEmp; ie < out.length; ie++) out[ie].c = "emprestimo";

  /* ---- cofrinho ---- */
  var antesCofre = out.length;
  var sug = sugestaoCofre(b);
  if(!passado && sug > 0.5 && b.guardado < sug - 0.5 && b.sobra > 0.5){
    var podeGuardar = Math.min(sug - b.guardado, b.sobra);
    out.push({n:"dica", t:"Dá pra guardar " + fmt(podeGuardar) + " neste mês",
      x:"São " + pctCofre() + "% " + (S.cofre.base === "renda" ? "da renda" : "do que sobra depois das contas") +
        ". Separando agora, o cofrinho chega a " + fmt(totalCofre() + podeGuardar) + " e o dinheiro para de ficar à mão pra gasto miúdo.",
      a:[at("Guardar agora", "guardar"), at("Mudar a porcentagem", "ir-aba", {aba:"cofre"})]});
  }
  if(b.guardado > 0.5 && b.sobra < -0.5)
    out.push({n:"atencao", t:"Você guardou mais do que cabia",
      x:"Foram " + fmt(b.guardado) + " pro cofrinho e o mês fechou em " + fmt(b.sobra) + ". Resgatar " + fmt(Math.min(b.guardado, -b.sobra)) + " tapa o buraco sem precisar de crédito.",
      a:[at("Resgatar", "resgatar"), at("Ver cofrinho", "ir-aba", {aba:"cofre"})]});

  var obj = S.cofre.objetivo || {};
  if(Number(obj.valor) > 0){
    var falta = Number(obj.valor) - totalCofre();
    if(falta <= 0)
      out.push({n:"boa", t:"Objetivo " + esc(obj.nome || "do cofrinho") + " alcançado",
        x:"O cofrinho tem " + fmt(totalCofre()) + ", acima dos " + fmt(obj.valor) + " que você marcou como meta.",
        a:[at("Ver cofrinho", "ir-aba", {aba:"cofre"}), at("Mudar objetivo", "objetivo")]});
    else if(sug > 0.5)
      out.push({n:"dica", t:"Faltam " + fmt(falta) + " para " + esc(obj.nome || "o objetivo"),
        x:"No ritmo de " + fmt(sug) + " por mês, são cerca de " + Math.ceil(falta / sug) + " meses.",
        a:[at("Guardar agora", "guardar"), at("Mudar objetivo", "objetivo")]});
  }
  for(var io2 = antesCofre; io2 < out.length; io2++) out[io2].c = "cofre";

  var peso = {alerta:0, atencao:1, boa:2, dica:3};
  out.forEach(function(c){ if(!c.c) c.c = "mes"; });
  out.sort(function(a,c){ return peso[a.n] - peso[c.n]; });
  return out;
}

/* ========== render ========== */
var view = document.getElementById("view");

function render(){
  var y = window.scrollY;
  var p = S.mes.split("-");
  document.getElementById("mesNome").textContent =
    MESES[(+p[1])-1].charAt(0).toUpperCase() + MESES[(+p[1])-1].slice(1) + " de " + p[0];
  var b = balanco(S.mes);
  document.getElementById("mesRenda").textContent = "entra " + fmtCurto(b.renda) +
    (b.aindaEntra > 0.5 ? " · " + fmtCurto(b.jaEntrou) + " já caiu" : "");

  var tabs = document.querySelectorAll(".tab");
  var ativa = null;
  for(var i=0;i<tabs.length;i++){
    var eAtual = tabs[i].dataset.tab === S.aba;
    tabs[i].setAttribute("aria-current", eAtual ? "true" : "false");
    if(eAtual) ativa = tabs[i];
  }
  centralizarAba(ativa);

  if(S.aba === "mes") viewMes(b);
  else if(S.aba === "renda") viewRenda(b);
  else if(S.aba === "agenda") viewAgenda(b);
  else if(S.aba === "part") viewParticoes(b);
  else if(S.aba === "cartao") viewCartao(b);
  else if(S.aba === "emprestimo") viewEmprestimos(b);
  else if(S.aba === "cofre") viewCofre(b);
  else if(S.aba === "casa") viewCasa(b);
  else if(S.aba === "historico") viewHistorico(b);
  else viewAjustes(b);

  window.scrollTo(0, y);
}

/* Ao entrar na aba Cartão, o mês pula para a fatura que ainda está aberta:
   é a que interessa quando se quer saber o que já está caindo nela. */
function irParaAba(aba){
  if(aba === "cartao" && S.aba !== "cartao"){
    var m = mesFaturaMaisProxima();
    if(m) S.mes = m;
  }
  S.aba = aba;
  render();
}

function centralizarAba(ativa){
  try{
    var barra = document.getElementById("tabs");
    if(!ativa || !barra || barra.scrollWidth <= barra.clientWidth + 4) return;
    var alvo = ativa.offsetLeft - (barra.clientWidth - ativa.offsetWidth) / 2;
    barra.scrollLeft = Math.max(0, Math.min(alvo, barra.scrollWidth - barra.clientWidth));
  }catch(e){}
}

function viewMes(b){
  if(b.renda <= 0 && S.particoes.length === 0){
    view.innerHTML =
      '<h2>Vamos começar pelo começo</h2>'+
      '<p class="sub">Diga quanto entra por mês. Depois você reparte esse dinheiro nas contas que se repetem, e o que sobrar é seu pra usar.</p>'+
      '<div class="vazio">Nenhuma renda cadastrada ainda.</div>'+
      '<button class="acao" data-act="nova-fixa">Cadastrar minha renda fixa</button>'+
      '<button class="acao leve" data-act="novo-ganho">Ganho deste mês</button>';
    return;
  }

  var total = Math.max(b.renda, b.comprometido + b.livres + Math.max(0, b.guardado)) || 1;
  var segs = "", leg = "";
  b.linhas.forEach(function(l){
    var v = Math.max(l.planejado, l.gasto);
    if(v <= 0) return;
    segs += '<div class="seg" style="width:'+(v/total*100)+'%;background:'+(l.p.cor||CORES[0])+'"></div>';
  });
  if(b.fatura.parcelas > 0)
    segs += '<div class="seg" style="width:'+(b.fatura.parcelas/total*100)+'%;background:var(--seg-cartao)"></div>';
  if(b.emprestimo.total > 0)
    segs += '<div class="seg" style="width:'+(b.emprestimo.total/total*100)+'%;background:var(--seg-emp)"></div>';
  if(b.livres > 0)
    segs += '<div class="seg" style="width:'+(b.livres/total*100)+'%;background:var(--seg-avulso)"></div>';
  if(b.guardado > 0)
    segs += '<div class="seg" style="width:'+(b.guardado/total*100)+'%;background:'+"var(--free)"+'"></div>';
  if(b.sobra > 0)
    segs += '<div class="seg" style="width:'+(b.sobra/total*100)+'%;background:var(--seg-livre)"></div>';

  var usadas = b.linhas.filter(function(l){ return Math.max(l.planejado,l.gasto) > 0; })
                       .map(function(l){ return l.p.cor||CORES[0]; });
  if(!usadas.length) usadas = [CORES[0]];
  var swatch = usadas.length > 1
    ? 'linear-gradient(90deg,'+usadas.map(function(c,i){
        return c+' '+(i/usadas.length*100)+'%,'+c+' '+((i+1)/usadas.length*100)+'%';
      }).join(",")+')'
    : usadas[0];
  leg = '<span><i style="background:'+swatch+'"></i>Repartições '+fmtCurto(b.comprometido - b.fatura.parcelas - b.emprestimo.total)+'</span>'+
        (b.fatura.parcelas>0 ? '<span><i style="background:var(--seg-cartao)"></i>Parcelas '+fmtCurto(b.fatura.parcelas)+'</span>' : '')+
        (b.emprestimo.total>0 ? '<span><i style="background:var(--seg-emp)"></i>Empréstimo '+fmtCurto(b.emprestimo.total)+'</span>' : '')+
        (b.livres>0 ? '<span><i style="background:var(--seg-avulso)"></i>Gastos avulsos '+fmtCurto(b.livres)+'</span>' : '')+
        (b.guardado>0 ? '<span><i style="background:var(--free)"></i>Cofrinho '+fmtCurto(b.guardado)+'</span>' : '')+
        '<span><i style="background:var(--seg-livre)"></i>Livre '+fmtCurto(Math.max(0,b.sobra))+'</span>';

  var dias = diasRestantes(S.mes);
  var diaria = "";
  if(dias > 0){
    var porDia = b.sobra / dias;
    diaria = '<div class="diaria'+(b.sobra<0?' neg':'')+'">'+
      (b.sobra >= 0
        ? 'Faltam '+dias+' dia'+(dias>1?'s':'')+' pro mês fechar. Dá <b>'+fmt(porDia)+' por dia</b> sem apertar nada.'
        : 'Faltam '+dias+' dia'+(dias>1?'s':'')+' e você já passou <b>'+fmt(-b.sobra)+'</b> do que entra.')+
      '</div>';
  }

  view.innerHTML =
    '<p class="sobra-label">'+(b.sobra>=0 ? 'Livre pra gastar' : 'Passou do que entra')+'</p>'+
    '<div class="sobra num '+(b.sobra>=0?'pos':'neg')+'">'+fmt(Math.abs(b.sobra))+'</div>'+
    '<p class="sobra-sub">depois de reservar tudo que é essencial</p>'+
    '<div class="regua">'+segs+'</div>'+
    '<div class="regua-legenda">'+leg+'</div>'+
    '<div class="dados">'+
      linha("Entra no mês", fmt(b.renda), true)+
      (b.aindaEntra > 0.5 ? linha("Já caiu na conta", fmt(b.jaEntrou)) + linha("Ainda entra", fmt(b.aindaEntra)) : "")+
      linha("Reservado nas repartições", fmt(b.comprometido - b.fatura.parcelas - b.emprestimo.total))+
      (b.emprestimo.total>0 ? linha("Parcelas de empréstimo", fmt(b.emprestimo.total), false, "ir-emprestimo") : "")+
      (b.fatura.parcelas>0 ? linha("Parcelas do cartão", fmt(b.fatura.parcelas)) : "")+
      (b.livres>0 ? linha("Gastos avulsos e compras", fmt(b.livres), false, "ver-avulsos") : "")+
      (b.guardado!==0 ? linha("Guardado no cofrinho", fmt(b.guardado)) : "")+
      linha("Já saiu da conta", fmt(b.jaSaiu))+
      linha("Ainda vai sair", fmt(b.aindaSai))+
      (b.fatura.total>0 ? linha("Fatura do cartão neste mês", fmt(b.fatura.total), false, "ir-cartao") : "")+
    '</div>'+
    diaria+
    blocoConselhos(S.mes, b)+
    '<button class="acao" data-act="gasto-livre">Lançar um gasto avulso</button>'+
    '<button class="acao leve" data-act="novo-ganho">Ganho deste mês</button>'+
    '<button class="acao leve" data-act="editar-renda">Ver minha renda</button>'+
    '<button class="acao leve" data-act="ir-historico">Ver os últimos 12 meses</button>';
}
function linha(rot, val, forte, acao){
  var corpo = '<span>'+rot+'</span><b class="num">'+val+'</b>';
  return acao
    ? '<button class="dado'+(forte?' forte':'')+'" data-act="'+acao+'">'+corpo+'</button>'
    : '<div class="dado'+(forte?' forte':'')+'">'+corpo+'</div>';
}

function blocoConselhos(m, b, titulo, niveis, cats, max){
  var cs = conselhos(m, b);
  if(niveis) cs = cs.filter(function(c){ return niveis.indexOf(c.n) > -1; });
  if(cats) cs = cs.filter(function(c){ return cats.indexOf(c.c) > -1; });
  cs = cs.slice(0, max || 6);
  if(!cs.length) return "";
  return '<div class="conselhos"><h3>'+(titulo || "O que dá pra fazer")+'</h3>'+cs.map(function(c){
    var chips = (c.a || []).map(function(x){
      var d = "";
      Object.keys(x.d || {}).forEach(function(k){ d += ' data-'+k+'="'+x.d[k]+'"'; });
      return '<button class="atalho" data-act="'+x.act+'"'+d+'>'+x.t+'</button>';
    }).join("");
    return '<div class="conselho '+c.n+'"><b>'+c.t+'</b><p>'+c.x+'</p>'+
      (chips ? '<div class="atalhos">'+chips+'</div>' : '')+'</div>';
  }).join("")+'</div>';
}

function mesCurto(m){ return MESES[(+m.split("-")[1])-1].slice(0,3); }

function viewRenda(b){
  var m = S.mes;
  var fixos = fixosDoMes(m);
  var extras = ganhosDoMes(m).map(function(g){
    return {id:g.id, nome:g.nome, valor:g.valor, dia:g.dia, recebido:g.recebido, fixa:false};
  });
  var totalFixa = totalRendas(S.rendaModelo);
  var totalGanhos = totalRendas(extras);

  var html = '<h2>Renda</h2>'+
    '<p class="sub">Tudo que entra. A renda fixa se repete todo mês na mesma data; o ganho vale só no mês em que caiu.</p>';

  if(!fixos.length && !extras.length){
    html += '<div class="vazio">Nada cadastrado ainda. Comece pela renda fixa, que é o salário ou o que entra todo mês na mesma data. Depois, o que cair fora disso você lança como ganho do mês.</div>'+
      '<button class="acao" data-act="nova-fixa">Cadastrar renda fixa</button>'+
      '<button class="acao leve" data-act="novo-ganho">Lançar ganho deste mês</button>';
    view.innerHTML = html;
    return;
  }

  var tot = Math.max(b.renda, 1);
  html += '<p class="sobra-label">Entra em '+nomeMes(m)+'</p>'+
    '<div class="sobra num pos">'+fmt(b.renda)+'</div>'+
    '<p class="sobra-sub">'+(b.aindaEntra > 0.5
      ? fmt(b.jaEntrou)+' já caíram na conta'
      : 'tudo já caiu na conta')+'</p>'+
    '<div class="regua">'+
      (b.jaEntrou > 0 ? '<div class="seg" style="width:'+(b.jaEntrou/tot*100)+'%;background:var(--free)"></div>' : '')+
      (b.aindaEntra > 0 ? '<div class="seg" style="width:'+(b.aindaEntra/tot*100)+'%;background:var(--seg-livre)"></div>' : '')+
    '</div>'+
    '<div class="regua-legenda">'+
      '<span><i style="background:var(--free)"></i>Já caiu '+fmtCurto(b.jaEntrou)+'</span>'+
      '<span><i style="background:var(--seg-livre)"></i>Ainda entra '+fmtCurto(b.aindaEntra)+'</span>'+
    '</div>'+
    '<div class="dados">'+
      linha("Renda fixa", fmt(totalFixa), true)+
      (totalGanhos !== 0 ? linha("Ganhos de "+nomeMes(m), fmt(totalGanhos)) : "")+
      linha("Já caiu na conta", fmt(b.jaEntrou))+
      linha("Ainda entra", fmt(b.aindaEntra))+
    '</div>';

  html += '<label>Renda fixa</label>'+
    (fixos.length
      ? '<div class="lista">'+fixos.map(function(r){ return itemReceb(m, r, "abrir-fixo"); }).join("")+'</div>'
      : '<div class="vazio">Nenhuma renda fixa cadastrada.</div>')+
    '<label>Ganhos de '+nomeMes(m)+'</label>'+
    (extras.length
      ? '<div class="lista">'+extras.map(function(r){ return itemReceb(m, r, "abrir-ganho"); }).join("")+'</div>'
      : '<div class="vazio">Nada além da renda fixa neste mês.</div>');

  var meses = [], maxV = 1;
  for(var k=5;k>=0;k--){
    var mm = mesVizinho(m, -k);
    var v = rendaDoMes(mm);
    meses.push({m:mm, v:v});
    if(v > maxV) maxV = v;
  }
  html += '<label>Últimos 6 meses</label>'+
    '<div class="lista">'+meses.map(function(x){
      return '<button class="item" data-act="ir-mes" data-mes="'+x.m+'" data-aba="renda">'+
        '<div class="item-topo">'+
          '<span class="item-nome"><em'+(x.m === m ? '' : ' style="color:var(--muted)"')+'>'+nomeMesTitulo(x.m)+'</em></span>'+
          '<span class="item-val num">'+fmt(x.v)+'</span>'+
        '</div>'+
        '<div class="barra"><div style="width:'+(x.v/maxV*100)+'%;background:var(--free)"></div></div>'+
      '</button>';
    }).join("")+'</div>';

  html += blocoConselhos(m, b, "Sobre a renda", null, ["renda"], 3)+
    '<button class="acao" data-act="novo-ganho">Ganho deste mês</button>'+
    '<button class="acao leve" data-act="nova-fixa">Adicionar renda fixa</button>';
  view.innerHTML = html;
}

function viewAgenda(b){
  var m = S.mes;
  var pj = projecao(m, b);
  var hd = diaDeHoje(m);
  var titulo = hd !== null ? "Caixa hoje" : (m < mesAtual() ? "Caixa no fim do mês" : "Caixa no começo do mês");

  var html = '<h2>Agenda do mês</h2>'+
    '<p class="sub">O que entra e o que vence, na ordem dos dias. O valor pequeno de cada linha é o caixa depois dela.</p>'+
    '<div class="saldo-topo">'+
      '<span>'+titulo+'</span>'+
      '<b class="num'+(pj.caixa < 0 ? ' neg' : '')+'">'+fmt(pj.caixa)+'</b>'+
      '<span>já entrou menos o que já saiu. Cumprindo tudo que ainda vence, o mês termina em '+fmt(pj.fim)+
        (pj.semData > 0 ? ', contando '+fmt(pj.semData)+' de repartições sem data marcada' : '')+'.</span>'+
    '</div>';

  if(!pj.pontos.length){
    html += '<div class="vazio">Nenhuma data marcada ainda. Diga o dia em que a renda cai e o vencimento de cada conta — é isso que faz o app avisar antes do aperto.</div>';
  }else{
    html += '<div class="lista">'+pj.pontos.map(function(pt){
      var e = pt.ev;
      var atrasado = e.tipo !== "in" && !e.feito && hd !== null && e.dia < hd;
      var cls = "ev" + (e.feito ? " feito" : "") + (hd !== null && e.dia === hd ? " hoje" : "") + (atrasado ? " atrasado" : "");
      var rot;
      if(e.tipo === "in")
        rot = (e.feito ? "recebido" : "a receber") + (e.fixa ? " · renda fixa" : " · ganho do mês");
      else if(e.tipo === "fatura")
        rot = (e.feito ? "fatura paga" : "fatura em aberto") + " · " + e.itens + (e.itens === 1 ? " parcela" : " parcelas") + (atrasado ? " · atrasada" : "");
      else if(e.tipo === "emp")
        rot = "empréstimo · parcela " + e.k + " de " + e.de + " · " + (e.feito ? "paga" : "a pagar") + (atrasado ? " · atrasada" : "");
      else
        rot = (e.feito ? "pago" : (e.pago > 0 ? "falta " + fmt(e.restante) : "a pagar") + (atrasado ? " · atrasado" : ""));
      var act = e.tipo === "in"
        ? 'data-act="'+(e.fixa ? "abrir-fixo" : "abrir-ganho")+'" data-id="'+e.rid+'"'
        : (e.tipo === "fatura"
            ? 'data-act="ir-cartao" data-id="'+e.cid+'"'
            : (e.tipo === "emp"
                ? 'data-act="abrir-emprestimo" data-id="'+e.eid+'"'
                : 'data-act="abrir-part" data-id="'+e.pid+'"'));
      return '<button class="'+cls+'" '+act+'>'+
        '<span class="ev-dia">'+e.dia+'<small>'+mesCurto(m)+'</small></span>'+
        '<span class="ev-corpo"><em>'+esc(e.nome)+'</em><small>'+rot+'</small></span>'+
        '<span class="ev-val '+(e.tipo === "in" ? "in" : "out")+' num">'+
          (e.tipo === "in" ? "+" : "−")+fmtCurto(e.valor)+
          '<small'+(pt.saldo < 0 ? ' class="neg"' : '')+'>saldo '+fmtCurto(pt.saldo)+'</small>'+
        '</span>'+
      '</button>';
    }).join("")+'</div>';
  }

  html += blocoConselhos(m, b, "Atenção nas datas", ["alerta","atencao"])+
    '<button class="acao" data-act="novo-ganho">Ganho deste mês</button>'+
    '<button class="acao leve" data-act="nova-part">Criar repartição com vencimento</button>';
  view.innerHTML = html;
}

function viewParticoes(b){
  var html = '<h2>Repartições</h2><p class="sub">Uma faixa pra cada conta que se repete. Toque pra lançar o que gastou.</p>';
  if(S.particoes.length === 0){
    html += '<div class="vazio">Nada repartido ainda. Comece pelas contas que chegam todo mês.</div>'+
            '<div class="chips">'+SUGESTOES.map(function(s){
              return '<button class="chip" data-act="nova-sug" data-nome="'+s+'">+ '+s+'</button>';
            }).join("")+'</div>';
  }else{
    html += '<div class="lista">'+b.linhas.map(function(l){
      var pct = l.planejado>0 ? Math.min(100, l.gasto/l.planejado*100) : (l.gasto>0?100:0);
      var estourou = l.gasto > l.planejado;
      var cor = estourou ? "var(--over)" : (pct>=80 ? "var(--warn)" : (l.p.cor||CORES[0]));
      var resta = l.planejado - l.gasto;
      return '<button class="item" data-act="abrir-part" data-id="'+l.p.id+'">'+
        '<div class="item-topo">'+
          '<span class="item-nome"><i class="tick" style="background:'+(l.p.cor||CORES[0])+'"></i><em>'+esc(l.p.nome)+'</em></span>'+
          '<span class="item-val num">'+fmt(l.gasto)+' <small>/ '+fmtCurto(l.planejado)+'</small></span>'+
        '</div>'+
        '<div class="barra"><div style="width:'+pct+'%;background:'+cor+'"></div></div>'+
        '<div class="item-pe"><span>'+(estourou
            ? '<span class="estourou">passou '+fmt(-resta)+'</span>'
            : 'ainda cabe '+fmt(resta))+'</span><span>'+(textoVencimentos(S.mes, l.p) || Math.round(pct)+'%')+'</span></div>'+
      '</button>';
    }).join("")+'</div>';
    html += '<div class="chips">'+SUGESTOES.filter(function(s){
              return !S.particoes.some(function(p){ return p.nome.toLowerCase() === s.toLowerCase(); });
            }).slice(0,8).map(function(s){
              return '<button class="chip" data-act="nova-sug" data-nome="'+s+'">+ '+s+'</button>';
            }).join("")+'</div>';
  }
  html += '<button class="acao" data-act="nova-part">Criar repartição</button>';
  view.innerHTML = html;
}

function textoVencimentos(m, p){
  var pc = parcelasDe(p);
  if(!pc.length) return "";
  var abertas = pc.filter(function(x){ return pagoDaParcela(m, x.id) < (Number(x.valor)||0) - 0.005; });
  if(!abertas.length) return '<span class="venc">tudo pago</span>';
  var dias = abertas.map(function(x){ return limitaDia(m, x.dia); }).sort(function(a,c){ return a-c; });
  var hd = diaDeHoje(m);
  var atrasada = hd !== null && dias[0] < hd;
  return '<span class="venc'+(atrasada ? ' atrasado' : '')+'">'+
    (atrasada ? 'venceu dia ' : 'vence dia ')+dias.join(", ")+'</span>';
}

function viewCartao(b){
  var m = S.mes;
  var hd = diaDeHoje(m);
  var html = '<h2>Cartão de crédito</h2>'+
    '<p class="sub">Cada compra vira parcelas nos meses certos. A fatura do mês entra no orçamento como qualquer outra conta.</p>';

  if(!S.cartoes.length){
    html += '<div class="vazio">Nenhum cartão cadastrado. Coloque o limite e o dia do vencimento, depois lance as compras parceladas.</div>'+
      '<button class="acao" data-act="novo-cartao">Adicionar cartão</button>';
    view.innerHTML = html;
    return;
  }

  S.cartoes.forEach(function(ct){
    var f = faturaDoCartao(ct.id, m);
    var jan = janelaDaFatura(ct, m);
    var lim = limiteUtil(ct);
    var convertido = limiteConvertido(ct);
    var usado = usadoDoCartao(ct.id);
    var pct = lim > 0 ? Math.min(100, Math.max(0, usado/lim*100)) : 0;
    var dia = limitaDia(m, ct.vencimento || 10);
    var atrasada = f.total > 0 && !f.pago && hd !== null && dia < hd;
    var perto = f.total > 0 && !f.pago && hd !== null && dia >= hd && dia - hd <= 5;
    var aberta = !f.pago && faturaAberta(ct, m);
    var mAberta = mesDaFaturaAberta(ct);
    var cfut = compromissoFuturo(ct.id, m);
    var corBarra = pct >= 90 ? "var(--over)" : (pct >= 75 ? "var(--warn)" : (ct.cor || CORES[0]));

    html += '<div class="cartao">'+
      '<div class="cartao-topo">'+
        '<button class="cartao-nome" data-act="abrir-cartao" data-id="'+ct.id+'">'+
          '<i class="tick" style="background:'+(ct.cor||CORES[0])+'"></i><em>'+esc(ct.nome)+'</em></button>'+
        '<span class="tag '+(f.total <= 0 ? '' : (f.pago ? 'ok' : (atrasada ? 'aberta' : (perto ? 'perto' : ''))))+'">'+
          (f.total <= 0 ? 'sem fatura'
            : (f.pago ? 'paga'
              : (aberta ? 'aberta até ' + jan.ate
                : (atrasada ? 'venceu dia ' + dia : 'vence dia ' + dia))))+
        '</span>'+
      '</div>'+
      '<div class="cartao-fat num'+(f.pago ? ' pago' : '')+'">'+fmt(f.total)+'</div>'+
      (f.pagoValor > 0 && !f.pago
        ? '<div class="cartao-sub"><b>'+fmt(f.pagoValor)+' já pagos</b> · faltam '+fmt(f.aberto)+'</div>'
        : '')+
      '<div class="cartao-sub">fatura de '+nomeMes(m)+' · '+f.itens.length+(f.itens.length === 1 ? ' lançamento' : ' lançamentos')+'</div>'+
      '<div class="cartao-sub">compras de '+jan.de+' a '+jan.ate+' · fecha '+jan.fecha+' · vence '+jan.vence+
        (aberta ? ' · ainda recebendo compras' : '')+'</div>'+
      (lim > 0
        ? '<div class="limite">Limite livre <b class="num">'+fmt(lim - usado)+'</b> de '+fmt(lim)+
            (convertido > 0 ? ' · '+fmt(convertido)+' convertidos em reserva' : '')+
            '<div class="barra"><div style="width:'+pct+'%;background:'+corBarra+'"></div></div></div>'
        : '<div class="limite">Sem limite cadastrado. Comprometido em parcelas: <b class="num">'+fmt(usado)+'</b></div>')+
      (f.itens.length
        ? '<div style="margin-top:12px">'+f.itens.map(function(it){
            if(it.tipo === "gasto")
              return '<button class="parc" data-act="abrir-gasto" data-gid="'+it.gasto.id+'" data-mes="'+it.mes+'">'+
                '<span class="parc-nome"><em>'+esc(it.nome)+'</em>'+
                  '<small>gasto de '+nomeMes(it.mes)+' · '+(f.pago ? 'paga' : 'em aberto')+'</small></span>'+
                '<span class="parc-val num">'+fmt(it.valor)+'</span>'+
              '</button>';
            return '<button class="parc" data-act="abrir-compra" data-id="'+it.compra.id+'">'+
              '<span class="parc-nome"><em>'+esc(it.nome)+'</em>'+
                '<small>parcela '+it.n+' de '+it.de+' · '+(f.pago ? 'paga' : 'em aberto')+'</small></span>'+
              '<span class="parc-val num">'+fmt(it.valor)+'</span>'+
            '</button>';
          }).join("")+'</div>'
        : '<p class="dica-campo">Nenhuma parcela cai neste mês.</p>')+
      (cfut.total > 0 ? '<p class="dica-campo">Depois deste mês ainda faltam '+fmt(cfut.total)+' em parcelas, até '+nomeMes(cfut.ultimo)+'.</p>' : '')+
      (m !== mAberta
        ? '<p class="dica-campo">A fatura que o banco mostra como atual é a de '+nomeMes(mAberta)+
            ', que fecha '+janelaDaFatura(ct, mAberta).ate+'.</p>'+
          '<div class="atalhos"><button class="atalho" data-act="ir-mes" data-mes="'+mAberta+'" data-aba="cartao">Ver a fatura aberta</button></div>'
        : '')+
      listaComprasCartao(ct, m)+
      (f.total > 0
        ? (f.pago
            ? '<button class="acao leve" data-act="desfazer-fatura" data-id="'+ct.id+'" data-mes="'+m+'">Desmarcar fatura paga</button>'
            : '<button class="acao" data-act="pagar-fatura" data-id="'+ct.id+'" data-mes="'+m+'">'+
                (aberta ? 'Adiantar pagamento' : 'Pagar fatura')+'</button>')
        : '')+
      '<button class="acao leve" data-act="abrir-cartao" data-id="'+ct.id+'">Editar cartão</button>'+
    '</div>';
  });

  html += blocoConselhos(m, b, "Lembretes do cartão", null, ["cartao"], 4)+
    '<button class="acao" data-act="nova-compra">Lançar compra no cartão</button>'+
    '<button class="acao leve" data-act="novo-cartao">Adicionar cartão</button>';
  view.innerHTML = html;
}

function listaComprasCartao(ct, m){
  var compras = S.comprasCartao.filter(function(c){ return c.cartao === ct.id; });
  if(!compras.length)
    return '<label>Compras neste cartão</label>'+
      '<div class="vazio">Nenhuma compra lançada. Toque em lançar compra e diga o valor e em quantas vezes.</div>';

  var info = compras.map(function(c){ return {c:c, st:situacaoCompra(c, m)}; });
  info.sort(function(a,b2){
    var pa = a.st.quitada ? 2 : (a.st.futura ? 1 : 0);
    var pb = b2.st.quitada ? 2 : (b2.st.futura ? 1 : 0);
    return pa - pb || b2.st.restante - a.st.restante;
  });
  var emAberto = info.reduce(function(t,x){ return t + x.st.restante; }, 0);

  return '<label>Compras neste cartão</label>'+
    '<div class="lista">'+info.map(function(x){
      var c = x.c, st = x.st;
      var pct = st.n > 0 ? Math.min(100, st.pagas / st.n * 100) : 0;
      var estado = st.quitada
        ? (st.antecipadas ? 'quitada, ' + st.antecipadas + ' antecipada' + (st.antecipadas > 1 ? 's' : '') : 'quitada')
        : (st.futura
            ? 'começa em ' + nomeMes(st.inicio)
            : (st.k ? 'parcela ' + st.k + ' de ' + st.n : 'entre ' + nomeMes(st.inicio) + ' e ' + nomeMes(st.fim)))
        + (!st.quitada && st.antecipadas ? ' · ' + st.antecipadas + ' antecipada' + (st.antecipadas > 1 ? 's' : '') : '');
      return '<button class="item" data-act="abrir-compra" data-id="'+c.id+'">'+
        '<div class="item-topo">'+
          '<span class="item-nome"><em'+(st.quitada ? ' style="color:var(--muted)"' : '')+'>'+esc(c.nome)+'</em></span>'+
          '<span class="item-val num">'+fmt(st.valor)+(st.n > 1 ? ' <small>x'+st.n+'</small>' : ' <small>à vista</small>')+'</span>'+
        '</div>'+
        (st.n > 1 ? '<div class="barra"><div style="width:'+pct+'%;background:'+(st.quitada ? "var(--free)" : (ct.cor || CORES[0]))+'"></div></div>' : '')+
        '<div class="item-pe"><span>'+estado+(c.data ? ' · comprado em ' + dataBR(c.data) : '')+'</span>'+
          '<span>'+(st.quitada ? 'total ' + fmtCurto(c.total) : 'faltam ' + fmtCurto(st.restante))+'</span></div>'+
      '</button>';
    }).join("")+'</div>'+
    '<p class="dica-campo">'+compras.length+(compras.length === 1 ? ' compra' : ' compras')+
      ' neste cartão, '+fmt(emAberto)+' ainda por pagar. Toque em qualquer uma para mudar valor, vezes ou mês de início.</p>';
}

function viewEmprestimos(b){
  var m = S.mes;
  var doMes = emprestimosDoMes(m);
  var html = '<h2>Empréstimos</h2>'+
    '<p class="sub">O que você pegou emprestado e paga em parcelas fixas. Cada parcela entra no orçamento do mês em que vence.</p>';

    html += '<div class="vazio">Nenhum empréstimo cadastrado. Coloque o valor da parcela, quantas são e quando começou, que o app cuida do resto.</div>'+
      '<button class="acao" data-act="novo-emprestimo">Cadastrar empréstimo</button>';
    view.innerHTML = html;
    return;

  html += '<div class="saldo-topo">'+
      '<span>Ainda devo</span>'+
      '<b class="num">'+fmt(dividaTotal())+'</b>'+
      '<span>'+(doMes.total > 0
        ? 'Neste mês vencem '+fmt(doMes.total)+(doMes.pago > 0 ? ', com '+fmt(doMes.pago)+' já pagos' : '')+'.'
        : 'Nenhuma parcela vence em '+nomeMes(m)+'.')+'</span>'+
    '</div>';

  html += '<div class="lista">'+S.emprestimos.map(function(e){
    var s = saldoEmprestimo(e);
    var k = parcelaEmprestimo(e, m);
    var pagaAqui = k && parcelaEmpPaga(e, m);

    return '<button class="item" data-act="abrir-emprestimo" data-id="'+e.id+'">'+
      '<div class="item-topo">'+
        '<span class="item-nome"><i class="tick" style="background:'+(e.cor||CORES[7])+'"></i>'+
          '<em>'+esc(e.nome || "Empréstimo")+'</em></span>'+
        '<span class="item-val num">'+fmt(valorParcelaEmp(e))+' <small>/mês</small></span>'+
      '</div>'+
      '<div class="barra"><div style="width:'+pct+'%;background:'+(s.restam ? (e.cor||CORES[7]) : "var(--free)")+'"></div></div>'+
      '<div class="item-pe">'+
        '<span>'+(s.restam === 0
          ? 'quitado'
          : (k ? 'parcela '+k+' de '+s.pagas+'/'+nParcelasEmp(e)+' pagas' : s.pagas+' de '+nParcelasEmp(e)+' pagas'))+
          (pagaAqui ? ' · paga neste mês' : (k ? ' · vence dia '+limitaDia(m, e.dia||10) : ''))+'</span>'+
        '<span>'+(s.restam ? 'faltam '+fmtCurto(s.saldo)+' até '+mesCurto(s.fim)+'/'+s.fim.slice(2,4) : 'total '+fmtCurto(s.total))+'</span>'+
      '</div>'+
    '</button>';

  if(doMes.itens.length){
    html += '<label>Vencem em '+nomeMes(m)+'</label><div class="lista" style="padding:2px 14px">'+
      doMes.itens.map(function(x){
        return '<div class="lanc"><span>'+esc(x.emp.nome || "Empréstimo")+
            '<small>dia '+x.dia+' · parcela '+x.n+' de '+x.de+'</small></span>'+
          '<span class="num">'+fmt(x.valor)+' '+
          (x.pago
            ? '<button data-act="desmarcar-emprestimo" data-id="'+x.emp.id+'" style="color:var(--muted);font-size:13px">desfazer</button>'
            : '<button data-act="pagar-emprestimo" data-id="'+x.emp.id+'" style="color:var(--brand);font-size:13px">marcar paga</button>')+
          '</span></div>';

  html += blocoConselhos(m, b, "Sobre as dívidas", null, ["emprestimo"], 3)+
    '<button class="acao" data-act="novo-emprestimo">Cadastrar empréstimo</button>';

}

function viewCofre(b){
