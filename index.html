function addGasto(pid, valor, nota, parc){
  if(!S.gastos[S.mes]) S.gastos[S.mes] = [];
  var g = {
    id:uid(), pid:pid||null, valor:valor, nota:nota||"",
    dia: new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})
  };
  if(parc) g.parc = parc;
  S.gastos[S.mes].push(g);
  salvar();
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act],[data-tab]");
  if(!el) return;

  if(el.dataset.tab){ S.aba = el.dataset.tab; render(); return; }
  var a = el.dataset.act;

  if(a === "mes-ant" || a === "mes-prox"){
    var p = S.mes.split("-"), d = new Date(+p[0], (+p[1]-1) + (a==="mes-prox"?1:-1), 1);
    S.mes = chaveMes(d); render(); return;
  }

  if(a === "ir-ajustes"){ S.aba = "ajustes"; render(); return; }
  if(a === "ir-historico"){ S.aba = "historico"; render(); return; }
  if(a === "ir-mes"){ S.mes = el.dataset.mes; S.aba = "mes"; render(); return; }
  if(a === "ver-texto"){ S.verTexto = !S.verTexto; render(); return; }
  if(a === "baixar"){
    try{
      var texto = JSON.stringify(dados());
      var blob = new Blob([texto], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "finances-controller-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(link);
      link.click();
      setTimeout(function(){
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 1500);
      toast("Arquivo da cópia gerado");
    }catch(e){
      S.verTexto = true; render();
      toast("Este navegador não baixou o arquivo. Copie o texto.");
    }
    return;
  }
  if(a === "abrir-arquivo"){
    var campo = document.getElementById("arq");
    if(campo) campo.click();
    return;
  }
  if(a === "limpar-antigos"){
    if(el.dataset.ok){
      var r = limparAntigos();
      salvar(); render();
      toast(r.n ? r.n + " registros antigos apagados" : "Não havia nada anterior a " + nomeMes(r.corte));
      return;
    }
    el.dataset.ok = "1";
    el.textContent = "Isso apaga meses antigos. Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar o que tem mais de 12 meses"; } }, 3500);
    return;
  }
  if(a === "ir-cartao"){ S.aba = "cartao"; render(); return; }

  if(a === "novo-cartao"){ sheetCartao(null); return; }
  if(a === "abrir-cartao"){ sheetCartao(el.dataset.id); return; }
  if(a === "salvar-cartao"){
    var ctNome = document.getElementById("ctn").value.trim();
    if(!ctNome){ toast("Falta o nome do cartão"); return; }
    var ctLim = parseNum(document.getElementById("ctl").value);
    var ctVenc = Math.max(1, Math.min(31, Math.round(parseNum(document.getElementById("ctv").value) || 10)));
    var corCt = sheet.querySelector('.cor[aria-pressed="true"]');
    var ctCor = corCt ? corCt.dataset.cor : CORES[0];
    var ctId = el.dataset.id;
    if(ctId){
      S.cartoes.forEach(function(x){
        if(x.id === ctId){ x.nome=ctNome; x.limite=ctLim; x.vencimento=ctVenc; x.cor=ctCor; }
      });
    }else{
      S.cartoes.push({id:uid(), nome:ctNome, limite:ctLim, vencimento:ctVenc, cor:ctCor});
    }
    salvar(); fecharSheet(); S.aba = "cartao"; render(); toast("Cartão salvo"); return;
  }
  if(a === "excluir-cartao"){
    var ctX = el.dataset.id;
    S.cartoes = S.cartoes.filter(function(x){ return x.id !== ctX; });
    S.comprasCartao = S.comprasCartao.filter(function(x){ return x.cartao !== ctX; });
    Object.keys(S.faturas).forEach(function(k){ if(k.indexOf(ctX + "|") === 0) delete S.faturas[k]; });
    salvar(); fecharSheet(); render(); toast("Cartão excluído"); return;
  }

  if(a === "nova-compra"){ sheetCompra(null); return; }
  if(a === "abrir-compra"){ sheetCompra(el.dataset.id); return; }
  if(a === "salvar-compra"){
    var cpNome = document.getElementById("cnm").value.trim();
    if(!cpNome){ toast("Falta o nome da compra"); return; }
    var cpTot = parseNum(document.getElementById("cvt").value);
    if(cpTot <= 0){ toast("Coloque um valor maior que zero"); return; }
    var cpN = Math.max(1, Math.min(99, Math.round(parseNum(document.getElementById("cnp").value) || 1)));
    var selCard = document.getElementById("ccc");
    var cpCid = selCard ? selCard.value : el.dataset.cartao;
    var cpIni = document.getElementById("cmi").value;
    var cpId = el.dataset.id;
    if(cpId){
      S.comprasCartao.forEach(function(c){
        if(c.id === cpId){ c.nome=cpNome; c.total=cpTot; c.parcelas=cpN; c.cartao=cpCid; c.inicio=cpIni; }
      });
    }else{
      S.comprasCartao.push({id:uid(), cartao:cpCid, nome:cpNome, total:cpTot, parcelas:cpN, inicio:cpIni});
    }
    salvar(); fecharSheet(); S.aba = "cartao"; render();
    toast(cpN > 1 ? cpN + "x de " + fmt(Math.round(cpTot/cpN*100)/100) : "Lançado " + fmt(cpTot));
    return;
  }
  if(a === "excluir-compra"){
    var cpX = el.dataset.id;
    S.comprasCartao = S.comprasCartao.filter(function(c){ return c.id !== cpX; });
    salvar(); fecharSheet(); render(); toast("Compra excluída"); return;
  }
  if(a === "pagar-fatura"){
    S.faturas[el.dataset.id + "|" + S.mes] = true;
    salvar(); render(); toast("Fatura marcada como paga"); return;
  }
  if(a === "desfazer-fatura"){
    delete S.faturas[el.dataset.id + "|" + S.mes];
    salvar(); render(); toast("Fatura reaberta"); return;
  }

  if(a === "set-pct"){
    S.cofre.pct = Math.max(0, Math.min(100, Number(el.dataset.pct)||0));
    salvar(); render(); toast("Separando " + pctCofre() + "% por mês"); return;
  }
  if(a === "pct-outro"){ sheetPct(); return; }
  if(a === "salvar-pct"){
    S.cofre.pct = Math.max(0, Math.min(100, parseNum(document.getElementById("pv").value)));
    salvar(); fecharSheet(); render(); toast("Separando " + pctCofre() + "% por mês"); return;
  }
  if(a === "set-base"){
    S.cofre.base = el.dataset.base === "renda" ? "renda" : "sobra";
    salvar(); render(); return;
  }
  if(a === "guardar"){ sheetCofreMov(1); return; }
  if(a === "resgatar"){ sheetCofreMov(-1); return; }
  if(a === "salvar-mov"){
    var mvVal = parseNum(document.getElementById("mv").value);
    if(mvVal <= 0){ toast("Coloque um valor maior que zero"); return; }
    var sinal = el.dataset.sinal === "-1" ? -1 : 1;
    if(sinal < 0 && mvVal > totalCofre() + 0.005){ toast("O cofrinho só tem " + fmt(totalCofre())); return; }
    S.cofre.movimentos.push({
      id:uid(), mes:S.mes, valor: sinal * mvVal,
      nota: document.getElementById("mn").value.trim(),
      dia: new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})
    });
    salvar(); fecharSheet(); render();
    toast(sinal > 0 ? "Guardado " + fmt(mvVal) : "Resgatado " + fmt(mvVal));
    return;
  }
  if(a === "apagar-mov"){
    var mvX = el.dataset.id;
    S.cofre.movimentos = S.cofre.movimentos.filter(function(x){ return x.id !== mvX; });
    salvar(); render(); toast("Movimento apagado"); return;
  }
  if(a === "objetivo"){ sheetObjetivo(); return; }
  if(a === "salvar-objetivo"){
    S.cofre.objetivo = {
      nome: document.getElementById("on").value.trim(),
      valor: parseNum(document.getElementById("ov").value)
    };
    salvar(); fecharSheet(); render(); toast("Objetivo salvo"); return;
  }
  if(a === "limpar-objetivo"){
    S.cofre.objetivo = {nome:"", valor:0};
    salvar(); fecharSheet(); render(); toast("Objetivo removido"); return;
  }

  if(a === "editar-renda"){ sheetRecebimentos(); return; }
  if(a === "editar-fixos"){ sheetFixos(); return; }
  if(a === "nova-fixa"){ sheetFixo(null); return; }
  if(a === "abrir-fixo"){ sheetFixo(el.dataset.id); return; }
  if(a === "novo-ganho"){ sheetGanho(null); return; }
  if(a === "abrir-ganho"){ sheetGanho(el.dataset.id); return; }

  if(a === "salvar-fixa"){
    var fNome = document.getElementById("rn").value.trim() || "Renda fixa";
    var fValor = parseNum(document.getElementById("rv").value);
    if(fValor <= 0){ toast("Coloque um valor maior que zero"); return; }
    var fDia = Math.max(1, Math.min(31, Math.round(parseNum(document.getElementById("rd").value) || 1)));
    var fId = el.dataset.id || uid();
    var achouF = false;
    S.rendaModelo.forEach(function(r){
      if(r.id !== fId) return;
      achouF = true; r.nome = fNome; r.valor = fValor; r.dia = fDia;
    });
    if(!achouF) S.rendaModelo.push({id:fId, nome:fNome, valor:fValor, dia:fDia});
    S.rendaModelo.sort(function(x,y){ return (Number(x.dia)||1) - (Number(y.dia)||1); });
    var selF = document.getElementById("rr");
    if(selF){
      var chave = S.mes + "|" + fId;
      if(selF.value === "sim") S.recebidos[chave] = true;
      else if(selF.value === "nao") S.recebidos[chave] = false;
      else delete S.recebidos[chave];
    }
    salvar(); fecharSheet(); render(); toast("Renda fixa salva"); return;
  }
  if(a === "excluir-fixa"){
    var fX = el.dataset.id;
    S.rendaModelo = S.rendaModelo.filter(function(r){ return r.id !== fX; });
    Object.keys(S.recebidos).forEach(function(k){
      if(k.split("|")[1] === fX) delete S.recebidos[k];
    });
    salvar(); fecharSheet(); render(); toast("Renda fixa removida"); return;
  }

  if(a === "salvar-ganho"){
    var gNome = document.getElementById("rn").value.trim() || "Ganho";
    var gValor = parseNum(document.getElementById("rv").value);
    if(gValor <= 0){ toast("Coloque um valor maior que zero"); return; }
    var gDia = limitaDia(S.mes, parseNum(document.getElementById("rd").value) || 1);
    var selG = document.getElementById("rr");
    var sitG = selG ? selG.value : "auto";
    var gId = el.dataset.id || uid();
    if(!Array.isArray(S.ganhos[S.mes])) S.ganhos[S.mes] = [];
    var listaG = S.ganhos[S.mes], achouG = false;
    listaG.forEach(function(x){
      if(x.id !== gId) return;
      achouG = true; x.nome = gNome; x.valor = gValor; x.dia = gDia;
      if(sitG === "sim") x.recebido = true;
      else if(sitG === "nao") x.recebido = false;
      else delete x.recebido;
    });
    if(!achouG){
      var novoG = {id:gId, nome:gNome, valor:gValor, dia:gDia};
      if(sitG === "sim") novoG.recebido = true;
      if(sitG === "nao") novoG.recebido = false;
      listaG.push(novoG);
    }
    listaG.sort(function(x,y){ return (Number(x.dia)||1) - (Number(y.dia)||1); });
    salvar(); fecharSheet(); render(); toast("Ganho de " + fmt(gValor) + " lançado"); return;
  }
  if(a === "excluir-ganho"){
    var gX = el.dataset.id;
    S.ganhos[S.mes] = ganhosDoMes(S.mes).filter(function(x){ return x.id !== gX; });
    if(!S.ganhos[S.mes].length) delete S.ganhos[S.mes];
    salvar(); fecharSheet(); render(); toast("Ganho removido"); return;
  }
  if(a === "virar-fixa"){
    var vX = el.dataset.id;
    var vG = ganhosDoMes(S.mes).filter(function(x){ return x.id === vX; })[0];
    if(!vG) return;
    S.rendaModelo.push({
      id:uid(), nome:vG.nome, valor:Number(vG.valor)||0,
      dia:Math.max(1, Math.min(31, Math.round(Number(vG.dia)||1)))
    });
    S.rendaModelo.sort(function(x,y){ return (Number(x.dia)||1) - (Number(y.dia)||1); });
    S.ganhos[S.mes] = ganhosDoMes(S.mes).filter(function(x){ return x.id !== vX; });
    if(!S.ganhos[S.mes].length) delete S.ganhos[S.mes];
    salvar(); fecharSheet(); render(); toast("Agora entra todo mês"); return;
  }

  if(a === "nova-part"){ sheetParticao(null); return; }
  if(a === "abrir-part"){ sheetParticao(el.dataset.id); return; }
  if(a === "nova-sug"){
    S.particoes.push({id:uid(), nome:el.dataset.nome, planejado:0, cor:CORES[S.particoes.length % CORES.length], parcelas:[]});
    salvar(); render();
    sheetParticao(S.particoes[S.particoes.length-1].id);
    return;
  }
  if(a === "cor"){
    var bts = sheet.querySelectorAll(".cor");
    for(var i=0;i<bts.length;i++) bts[i].setAttribute("aria-pressed", bts[i]===el ? "true":"false");
    return;
  }
  if(a === "add-parcela"){
    var cont = document.getElementById("parcelas");
    if(cont){
      cont.insertAdjacentHTML("beforeend", linhaParcela(null));
      var campos = cont.querySelectorAll(".pdia");
      campos[campos.length-1].focus();
    }
    return;
  }
  if(a === "rm-parcela"){
    var alvo = el.closest(".parcela");
    if(alvo) alvo.parentNode.removeChild(alvo);
    return;
  }
  if(a === "pagar-parcela"){
    var pAlvo = S.particoes.filter(function(x){ return x.id === el.dataset.id; })[0];
    if(!pAlvo) return;
    var pcAlvo = parcelasDe(pAlvo).filter(function(x){ return x.id === el.dataset.parc; })[0];
    if(!pcAlvo) return;
    var falta = (Number(pcAlvo.valor)||0) - pagoDaParcela(S.mes, pcAlvo.id);
    if(falta <= 0){ toast("Essa parcela já está paga"); return; }
    addGasto(pAlvo.id, falta, "vencimento dia " + limitaDia(S.mes, pcAlvo.dia), pcAlvo.id);
    fecharSheet(); render(); toast("Pago " + fmt(falta)); return;
  }
  if(a === "salvar-part"){
    var nome = document.getElementById("fn").value.trim();
    if(!nome){ toast("Falta o nome da repartição"); return; }
    var plan = parseNum(document.getElementById("fp").value);
    var corSel = sheet.querySelector('.cor[aria-pressed="true"]');
    var cor = corSel ? corSel.dataset.cor : CORES[0];
    var novasParcelas = [];
    var linhasP = sheet.querySelectorAll(".parcela");
    for(var li=0; li<linhasP.length; li++){
      var valP = parseNum(linhasP[li].querySelector(".pval").value);
      if(valP <= 0) continue;
      novasParcelas.push({
        id: linhasP[li].dataset.parc || uid(),
        dia: limitaDia(S.mes, parseNum(linhasP[li].querySelector(".pdia").value) || 1),
        valor: valP
      });
    }
    novasParcelas.sort(function(x,y){ return x.dia - y.dia; });
    if(novasParcelas.length)
      plan = novasParcelas.reduce(function(t,x){ return t + x.valor; }, 0);
    var id = el.dataset.id;
    if(id){
      S.particoes.forEach(function(p){
        if(p.id===id){ p.nome=nome; p.planejado=plan; p.cor=cor; p.parcelas=novasParcelas; }
      });
    }else{
      S.particoes.push({id:uid(), nome:nome, planejado:plan, cor:cor, parcelas:novasParcelas});
    }
    salvar(); fecharSheet(); render(); toast("Repartição salva"); return;
  }
  if(a === "excluir-part"){
    var pid = el.dataset.id;
    S.particoes = S.particoes.filter(function(p){ return p.id !== pid; });
    Object.keys(S.gastos).forEach(function(m){
      S.gastos[m] = S.gastos[m].map(function(g){
        if(g.pid === pid){ g.pid = null; g.nota = g.nota || "de repartição excluída"; }
        return g;
      });
    });
    salvar(); fecharSheet(); render(); toast("Repartição excluída"); return;
  }
  if(a === "salvar-gasto"){
    var val = parseNum(document.getElementById("fg").value);
    if(val <= 0){ toast("Coloque um valor maior que zero"); return; }
    addGasto(el.dataset.id, val, "");
    fecharSheet(); render(); toast("Lançado "+fmt(val)); return;
  }
  if(a === "apagar-gasto"){
    var gid = el.dataset.gid;
    S.gastos[S.mes] = gastosDoMes(S.mes).filter(function(g){ return g.id !== gid; });
    salvar(); fecharSheet(); render(); toast("Lançamento apagado"); return;
  }

  if(a === "gasto-livre"){ sheetGastoLivre(); return; }
  if(a === "salvar-livre"){
    var vl = parseNum(document.getElementById("gv").value);
    if(vl <= 0){ toast("Coloque um valor maior que zero"); return; }
    addGasto(null, vl, document.getElementById("gn").value.trim());
    fecharSheet(); render(); toast("Lançado "+fmt(vl)); return;
  }

  if(a === "novo-item"){ sheetItem(null); return; }
  if(a === "abrir-item"){ sheetItem(el.dataset.id); return; }
  if(a === "salvar-item"){
    var inome = document.getElementById("in").value.trim();
    if(!inome){ toast("Falta o nome do item"); return; }
    var ipreco = parseNum(document.getElementById("ip").value);
    var iprio = +document.getElementById("ipr").value;
    var iid = el.dataset.id;
    if(iid){
      S.compras.forEach(function(c){ if(c.id===iid){ c.nome=inome; c.preco=ipreco; c.prio=iprio; } });
    }else{
      S.compras.push({id:uid(), nome:inome, preco:ipreco, prio:iprio, compradoEm:null});
    }
    salvar(); fecharSheet(); render(); toast("Item salvo"); return;
  }
  if(a === "comprar"){
    var cid = el.dataset.id;
    S.compras.forEach(function(c){
      if(c.id===cid){ c.compradoEm = S.mes; addGasto(null, Number(c.preco)||0, c.nome); }
    });
    salvar(); fecharSheet(); render(); toast("Comprado e lançado no mês"); return;
  }
  if(a === "descomprar"){
    var did = el.dataset.id;
    S.compras.forEach(function(c){
      if(c.id===did){
        var m = c.compradoEm;
        if(m && S.gastos[m]){
          var idx = -1;
          for(var k=S.gastos[m].length-1;k>=0;k--){
            if(!S.gastos[m][k].pid && S.gastos[m][k].nota === c.nome){ idx = k; break; }
          }
          if(idx > -1) S.gastos[m].splice(idx,1);
        }
        c.compradoEm = null;
      }
    });
    salvar(); fecharSheet(); render(); toast("Voltou pra lista"); return;
  }
  if(a === "excluir-item"){
    var eid = el.dataset.id;
    S.compras = S.compras.filter(function(c){ return c.id !== eid; });
    salvar(); fecharSheet(); render(); toast("Item removido"); return;
  }

  if(a === "copiar"){
    var ta = document.getElementById("bk");
    ta.select(); ta.setSelectionRange(0, 999999);
    try{ document.execCommand("copy"); toast("Cópia na área de transferência"); }
    catch(e){ toast("Selecione o texto e copie na mão"); }
    return;
  }
  if(a === "restaurar"){
    try{
      aplicarDados(JSON.parse(document.getElementById("bk").value));
      salvar(); render(); toast("Dados restaurados");
    }catch(e){ toast("Esse texto não é uma cópia válida"); }
    return;
  }
  if(a === "limpar-mes"){
    if(el.dataset.ok){
      delete S.gastos[S.mes]; salvar(); render(); toast("Lançamentos do mês apagados"); return;
    }
    el.dataset.ok = "1"; el.textContent = "Tem certeza? Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar os lançamentos deste mês"; } }, 3500);
    return;
  }
  if(a === "zerar"){
    if(el.dataset.ok){
      localStorage.removeItem(KEY);
      localStorage.removeItem(KEY_ANTIGA);
      S.rendaModelo=[]; S.ganhos={}; S.recebidos={};
      S.particoes=[]; S.gastos={}; S.compras=[];
      S.cartoes=[]; S.comprasCartao=[]; S.faturas={};
      S.cofre={pct:COFRE_PADRAO.pct, base:"sobra", objetivo:{nome:"", valor:0}, movimentos:[]};
      S.aba="mes"; render(); toast("Tudo zerado"); return;
    }
    el.dataset.ok = "1"; el.textContent = "Isso apaga tudo. Toque de novo";
    setTimeout(function(){ if(el.dataset.ok){ delete el.dataset.ok; el.textContent = "Apagar tudo e recomeçar"; } }, 3500);
    return;
  }
});

document.addEventListener("change", function(ev){
  var campo = ev.target;
  if(!campo || campo.id !== "arq" || !campo.files || !campo.files[0]) return;
  var leitor = new FileReader();
  leitor.onload = function(){
    try{
      aplicarDados(JSON.parse(String(leitor.result)));
      salvar(); render();
      toast("Dados restaurados do arquivo");
    }catch(e){ toast("Esse arquivo não é uma cópia válida"); }
  };
  leitor.onerror = function(){ toast("Não consegui ler esse arquivo"); };
  leitor.readAsText(campo.files[0]);
  campo.value = "";
});

document.addEventListener("input", function(){
  var dica = document.getElementById("dicaParcela");
  if(!dica) return;
  var campoV = document.getElementById("cvt"), campoN = document.getElementById("cnp");
  if(!campoV || !campoN) return;
  var tot = parseNum(campoV.value);
  var n = Math.max(1, Math.min(99, Math.round(parseNum(campoN.value) || 1)));
  dica.textContent = tot <= 0
    ? "Preencha o valor e as vezes para ver a parcela."
    : (n > 1 ? n + "x de " + fmt(Math.round(tot/n*100)/100) + " · total " + fmt(tot) : "à vista, " + fmt(tot));
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape") fecharSheet();
  if(e.key === "Enter" && sheet.classList.contains("on")){
    var alvo = sheet.querySelector('[data-act^="salvar"]');
    if(alvo && e.target.tagName === "INPUT"){ e.preventDefault(); alvo.click(); }
  }
});

carregar();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
</body>
</html>
