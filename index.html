<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Finances controller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F5">
<style>
:root{
  --bg:#F2F3F5;
  --surface:#FFFFFF;
  --ink:#14161A;
  --muted:#6B7280;
  --line:#E3E5E9;
  --brand:#1B3A6B;
  --free:#1E8E63;
  --warn:#C07C1E;
  --over:#B23B2E;
  --on-brand:#FFFFFF;
  --press:#F7F8FA;
  --soft:#EDEFF3;
  --soft2:#EEF1F6;
  --ok-bg:#E4F4EC;
  --over-bg:#FBEAE8;
  --warn-bg:#FAF0DF;
  --glass:rgba(242,243,245,.92);
  --glass2:rgba(255,255,255,.94);
  --puxador:#C9CDD4;
  --seg-livre:#D8DCE2;
  --seg-avulso:#9AA1AC;
  --seg-cartao:#3A4655;
  --seg-emp:#8A5A3B;
  --toast-bg:#14161A;
  --toast-ink:#FFFFFF;
  --backdrop:rgba(10,12,16,.38);
  --pad:16px;
  --radius:14px;
  color-scheme:light;
}
:root[data-tema=escuro]{
  --bg:#0F1115;--surface:#1A1D23;--ink:#ECEEF2;--muted:#9AA3B2;--line:#2A2F38;
  --brand:#8FB0E8;--free:#4CC08E;--warn:#E0A54A;--over:#E5675A;--on-brand:#0F1115;
  --press:#22262E;--soft:#262B34;--soft2:#243047;
  --ok-bg:#173A2C;--over-bg:#3E1F1C;--warn-bg:#3C2E15;
  --glass:rgba(15,17,21,.9);--glass2:rgba(26,29,35,.94);
  --puxador:#3A404B;--seg-livre:#3A404B;--seg-avulso:#6B7380;--seg-cartao:#9AA6B8;--seg-emp:#C08A63;
  --toast-bg:#ECEEF2;--toast-ink:#14161A;--backdrop:rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema=claro]){
    --bg:#0F1115;--surface:#1A1D23;--ink:#ECEEF2;--muted:#9AA3B2;--line:#2A2F38;
    --brand:#8FB0E8;--free:#4CC08E;--warn:#E0A54A;--over:#E5675A;--on-brand:#0F1115;
    --press:#22262E;--soft:#262B34;--soft2:#243047;
    --ok-bg:#173A2C;--over-bg:#3E1F1C;--warn-bg:#3C2E15;
    --glass:rgba(15,17,21,.9);--glass2:rgba(26,29,35,.94);
    --puxador:#3A404B;--seg-livre:#3A404B;--seg-avulso:#6B7380;--seg-cartao:#9AA6B8;--seg-emp:#C08A63;
    --toast-bg:#ECEEF2;--toast-ink:#14161A;--backdrop:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-texto=grande]{zoom:1.12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- topo ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--glass);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) var(--pad) 8px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.mes{text-align:center;flex:1}
.mes b{display:block;font-size:17px;font-weight:600}
.mes span{display:block;font-size:12px;color:var(--muted)}
.nav-mes{
  width:40px;height:40px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);font-size:19px;color:var(--brand);
  display:flex;align-items:center;justify-content:center;flex:none;
}
main{padding:var(--pad) var(--pad) 24px;max-width:560px;margin:0 auto}

/* ---------- hero: a régua do mês ---------- */
.sobra-label{font-size:14px;color:var(--muted);margin:4px 0 2px}
.sobra{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.025em}
.sobra.neg{color:var(--over)}
.sobra.pos{color:var(--free)}
.sobra-sub{font-size:14px;color:var(--muted);margin-top:6px}

.regua{
  margin:20px 0 10px;height:34px;width:100%;
  border-radius:8px;overflow:hidden;display:flex;background:var(--line);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
}
.seg{height:100%;transition:width .35s ease}
.regua-legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.regua-legenda i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:.5px}

.dados{
  margin-top:18px;border-top:1px solid var(--line);
}
.dado{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.dado span{font-size:15px;color:var(--muted)}
button.dado{width:100%;text-align:left}
button.dado:active{background:var(--press)}
button.dado span:after{content:" ›";color:var(--brand);font-weight:600}
.dado b{font-size:16px;font-weight:600}
.dado.forte b{color:var(--ink)}

.diaria{
  margin-top:18px;padding:14px 16px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);
  font-size:15px;
}
.diaria b{color:var(--free)}
.diaria.neg b{color:var(--over)}

/* ---------- listas ---------- */
h2{font-size:20px;font-weight:650;margin:4px 0 2px;letter-spacing:-.015em}
.sub{font-size:14px;color:var(--muted);margin:0 0 16px}

.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.item{
  display:block;width:100%;text-align:left;
  padding:13px 14px;border-bottom:1px solid var(--line);
}
.item:last-child{border-bottom:0}
.item:active{background:var(--press)}
.item-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item-nome{font-size:16px;font-weight:550;display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.tick{width:4px;height:17px;border-radius:2px;flex:none}
.item-nome em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-val{font-size:15px;font-weight:600;flex:none}
.item-val small{font-weight:400;color:var(--muted);font-size:13px}
.barra{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.barra div{height:100%;border-radius:3px;transition:width .3s ease}
.item-pe{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.item-pe .estourou{color:var(--over);font-weight:600}

.vazio{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:22px 18px;text-align:center;color:var(--muted);font-size:15px;background:var(--surface);
}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:18px;
  padding:8px 14px;font-size:14px;color:var(--brand);font-weight:550;
}
.chip:active{background:var(--soft2)}

.acao{
  display:block;width:100%;margin-top:16px;padding:15px;
  border-radius:var(--radius);background:var(--brand);color:var(--on-brand);
  font-size:16px;font-weight:600;text-align:center;
}
.acao:active{opacity:.85}
.acao.leve{background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.acao.perigo{background:var(--surface);color:var(--over);border:1px solid var(--line)}

/* ---------- compras ---------- */
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:11px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--free)}
.badge.nao{background:var(--over-bg);color:var(--over)}
.badge.feito{background:var(--soft);color:var(--muted)}
.prio{font-size:12px;color:var(--muted)}
.resumo-compras{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;font-size:15px;
}
.resumo-compras b{font-weight:650}

/* ---------- campos ---------- */
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],input[inputmode],select,textarea{
  width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface);font-size:16px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:47px}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.linha2{display:flex;gap:10px;align-items:flex-end}
.linha2>*{flex:1;min-width:0}
.linha2 label{margin-top:14px}
.cores{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cor{width:34px;height:34px;border-radius:17px;border:2px solid transparent}
.cor[aria-pressed=true]{border-color:var(--ink)}

/* ---------- conselhos ---------- */
.conselhos{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.conselhos h3{margin:2px 0 -2px;font-size:15px;font-weight:650}
.conselho{
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);
  border-radius:var(--radius);padding:12px 14px;
}
.conselho b{display:block;font-size:15px;font-weight:650;margin-bottom:2px}
.conselho p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.conselho.alerta{border-left-color:var(--over)}
.conselho.alerta b{color:var(--over)}
.conselho.atencao{border-left-color:var(--warn)}
.conselho.atencao b{color:var(--warn)}
.conselho.boa{border-left-color:var(--free)}
.conselho.boa b{color:var(--free)}
.conselho.dica{border-left-color:var(--brand)}
.atalhos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.atalho{
  border:1px solid var(--line);background:var(--surface);border-radius:14px;
  padding:6px 12px;font-size:13px;font-weight:600;color:var(--brand);
}
.atalho:active{background:var(--soft2)}
.conselho.dica b{color:var(--brand)}

/* ---------- agenda ---------- */
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev:active{background:var(--press)}
.ev-dia{
  flex:none;width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:16px;font-weight:650;line-height:1.05;
}
.ev-dia small{font-size:9px;font-weight:550;letter-spacing:.04em;text-transform:uppercase}
.ev.hoje .ev-dia{background:var(--brand);color:var(--on-brand)}
.ev.atrasado .ev-dia{background:var(--over-bg);color:var(--over)}
.ev-corpo{flex:1;min-width:0}
.ev-corpo em{font-style:normal;font-weight:550;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-corpo small{color:var(--muted);font-size:13px}
.ev-val{flex:none;text-align:right;font-size:15px;font-weight:600}
.ev-val.in{color:var(--free)}
.ev-val small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.ev-val small.neg{color:var(--over);font-weight:600}
.ev.feito .ev-corpo em,.ev.feito .ev-val{opacity:.5}
.saldo-topo{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;
}
.saldo-topo b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.saldo-topo b.neg{color:var(--over)}
.saldo-topo span{font-size:14px;color:var(--muted)}

/* ---------- parcelas ---------- */
.parcela{display:flex;gap:8px;align-items:center;margin-top:8px}
.parcela .pdia{flex:0 0 88px}
.parcela .prm{flex:none;width:44px;height:47px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);font-size:17px}
.dica-campo{font-size:13px;color:var(--muted);margin:6px 0 0}
.venc{font-size:12px;color:var(--muted)}
.venc.atrasado{color:var(--over);font-weight:600}

/* ---------- cartão ---------- */
.cartao{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;
}
.cartao-topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cartao-nome{font-size:16px;font-weight:650;display:flex;align-items:center;gap:9px;min-width:0}
.cartao-nome em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartao-fat{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:10px;line-height:1.1}
.cartao-fat.pago{color:var(--free)}
.cartao-sub{font-size:13px;color:var(--muted);margin-top:3px}
.cartao-sub b{color:var(--ink);font-weight:600}
.limite{margin-top:14px;font-size:13px;color:var(--muted)}
.limite .barra{margin-top:7px}
.parc{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;
}
.parc:last-child{border-bottom:0}
.parc-nome{min-width:0;flex:1}
.parc-nome em{font-style:normal;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parc small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.parc-val{flex:none;font-weight:600}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--free)}
.tag.aberta{background:var(--over-bg);color:var(--over)}
.tag.perto{background:var(--warn-bg);color:var(--warn)}

/* ---------- cofrinho ---------- */
.cofre-saldo{font-size:42px;font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--free)}
.pcts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pct{
  border:1px solid var(--line);background:var(--surface);border-radius:16px;
  padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);
}
.pct[aria-pressed=true]{border-color:var(--brand);color:var(--brand);background:var(--soft2)}
.mov{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.mov:last-child{border-bottom:0}
.mov small{display:block;color:var(--muted);font-size:12px}
.mov b.tira{color:var(--over)}

/* ---------- sheet ---------- */
.backdrop{
  position:fixed;inset:0;background:var(--backdrop);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:8px var(--pad) calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 30px rgba(10,12,16,.14);
  pointer-events:none;
}
.sheet.on{transform:translateY(0);pointer-events:auto}
.puxador{width:38px;height:4px;border-radius:2px;background:var(--puxador);margin:6px auto 12px}
.sheet h3{margin:0 0 2px;font-size:19px;font-weight:650;letter-spacing:-.015em}
.sheet .sub{margin-bottom:4px}
.lanc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
button.lanc,button.mov{width:100%;text-align:left}
button.lanc:active,button.mov:active{background:var(--press)}
.lanc .num,.mov .num{flex:none}
.lanc small{color:var(--muted);display:block;font-size:13px}
.lanc button{color:var(--over);font-size:13px}

/* ---------- tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--glass2);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;scroll-behavior:smooth;
  scroll-snap-type:x proximity;
}
.tabs::-webkit-scrollbar{display:none}
.marca{display:none}
.tab{
  flex:0 0 auto;min-width:76px;padding:8px 6px 9px;text-align:center;color:var(--muted);
  font-size:11px;font-weight:550;white-space:nowrap;
  scroll-snap-align:center;
}
.tab svg{
  display:block;margin:0 auto 4px;width:48px;height:30px;padding:4px 12px;border-radius:15px;
  stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  transition:background .15s ease;
}
.tab[aria-current=true] svg{background:var(--soft2)}
.nav-mes.eng svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=true]{color:var(--brand)}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);z-index:60;
  background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:20px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .22s ease;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- telas largas: navegação lateral ---------- */
@media (min-width:900px){
  :root{--lateral:232px;--coluna:720px}
  body{padding-bottom:40px}

  .tabs{
    top:0;bottom:0;left:0;right:auto;width:var(--lateral);
    flex-direction:column;align-items:stretch;gap:2px;
    overflow-x:hidden;overflow-y:auto;padding:22px 14px;
    border-top:0;border-right:1px solid var(--line);
    background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;
    scroll-snap-type:none;
  }
  .marca{display:block;padding:6px 12px 18px}
  .marca b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .marca span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .tab{
    display:flex;align-items:center;gap:12px;min-width:0;
    padding:10px 12px;border-radius:12px;text-align:left;font-size:14px;font-weight:550;
  }
  .tab svg{width:22px;height:22px;padding:0;margin:0;border-radius:0;background:none;stroke-width:1.7}
  .tab[aria-current=true]{background:var(--soft2);color:var(--brand)}
  .tab[aria-current=true] svg{background:none}

  header{
    margin-left:var(--lateral);
    justify-content:center;gap:14px;
    padding:14px var(--pad);
  }
  .mes{flex:0 1 340px}
  .mes b{font-size:20px}
  .mes span{font-size:13px}
  .nav-mes.eng{display:none}

  main{
    max-width:none;margin:0 0 0 var(--lateral);
    padding:32px max(40px, calc((100vw - var(--lateral) - var(--coluna)) / 2)) 60px;
  }
  .sobra{font-size:54px}

  .sheet{
    left:calc(var(--lateral) + (100vw - var(--lateral)) / 2);right:auto;bottom:auto;top:50%;
    width:min(580px, calc(100vw - var(--lateral) - 48px));
    border-radius:20px;padding:18px 26px 26px;max-height:86vh;
    transform:translate(-50%,-46%) scale(.98);opacity:0;
    transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .18s ease;
    box-shadow:0 24px 70px rgba(0,0,0,.28);
  }
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .puxador{display:none}
  .toast{left:calc(var(--lateral) + (100vw - var(--lateral)) / 2);bottom:36px}
}

/* ---------- mouse: estados de hover ---------- */
@media (hover:hover){
  button{cursor:pointer}
  .item:hover,.ev:hover,.parc:hover,button.lanc:hover,button.mov:hover,button.dado:hover{background:var(--press)}
  .tab:hover{color:var(--brand)}

  .acao:hover{filter:brightness(1.06)}
  .pct:hover,.chip:hover,.atalho:hover,.nav-mes:hover{border-color:var(--brand)}
}
</style>
</head>
